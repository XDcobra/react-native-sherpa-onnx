# Build lexbor for Android and publish as GitHub Release and to Maven.
# Release tag is read from third_party/lexbor_prebuilt/ANDROID_RELEASE_TAG.
# AAR is published to GitHub Pages Maven as com.xdcobra.sherpa:lexbor when MAVEN_REPO_PAT is set.
#
# When to run manually (Actions --> Prebuilt - lexbor (Android) Release --> Run workflow):
# 1. After updating third_party/lexbor_prebuilt/ANDROID_RELEASE_TAG or lexbor submodule.
# 2. When you want to publish a new lexbor Android release (zip + AAR, optional Maven).
#
name: Prebuilt - lexbor (Android) Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lexbor-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Read release tag
        id: tag
        run: |
          TAG_FILE=third_party/lexbor_prebuilt/ANDROID_RELEASE_TAG
          if [ ! -f "$TAG_FILE" ]; then
            echo "::error::Missing $TAG_FILE (add a line with the release tag, e.g. lexbor-android-v3.0.0)"
            exit 1
          fi
          RELEASE_TAG=$(grep -v '^#' "$TAG_FILE" | grep -v '^[[:space:]]*$' | head -1 | tr -d '\r\n')
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::Empty release tag in $TAG_FILE"
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          MAVEN_VERSION=$(echo "$RELEASE_TAG" | sed 's/^lexbor-android-v//')
          echo "maven_version=$MAVEN_VERSION" >> $GITHUB_OUTPUT
          echo "Using release tag: $RELEASE_TAG (Maven version: $MAVEN_VERSION)"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true
          local-cache: false

      - name: Get submodule versions
        id: submodules
        run: |
          echo "lexbor=$(git -C third_party/lexbor rev-parse HEAD 2>/dev/null || echo 'none')" >> "$GITHUB_OUTPUT"

      - name: Cache lexbor prebuilts
        uses: actions/cache@v6
        id: lexbor-cache
        with:
          path: |
            third_party/lexbor_prebuilt/android
          key: lexbor-android-prebuilt-${{ steps.submodules.outputs.lexbor }}-${{ hashFiles('third_party/lexbor_prebuilt/build_lexbor_android.sh') }}

      - name: Build lexbor
        if: steps.lexbor-cache.outputs.cache-hit != 'true'
        run: |
          cd third_party/lexbor_prebuilt
          chmod +x build_lexbor_android.sh
          ./build_lexbor_android.sh
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Package jniLibs layout
        run: |
          LAYOUT=lexbor-android-layout
          rm -rf "$LAYOUT"
          mkdir -p "$LAYOUT"
          ABIS="arm64-v8a armeabi-v7a x86 x86_64"
          for abi in $ABIS; do
            mkdir -p "$LAYOUT/$abi"
            SRC="third_party/lexbor_prebuilt/android/jni/$abi"
            if [ ! -d "$SRC" ]; then
              SRC="third_party/lexbor_prebuilt/android/$abi/lib"
            fi
            if [ -d "$SRC" ]; then
              cp "$SRC"/*.so "$LAYOUT/$abi/" 2>/dev/null || true
            fi
          done
          if [ -d "third_party/lexbor_prebuilt/android/include" ]; then
            mkdir -p "$LAYOUT/include"
            cp -R third_party/lexbor_prebuilt/android/include/* "$LAYOUT/include/"
          fi
          echo "Layout contents:"
          find "$LAYOUT" -type f \( -name '*.so' -o -name '*.h' \) | head -50

      - name: Upload layout as artifact
        uses: actions/upload-artifact@v7
        with:
          name: lexbor-android-layout-${{ steps.tag.outputs.maven_version }}
          path: lexbor-android-layout/
          retention-days: 7

      - name: Create release zip
        run: |
          cd lexbor-android-layout
          zip -r ../lexbor-android.zip .
          cd ..
          ls -la lexbor-android.zip

      - name: Create lexbor AAR
        run: |
          chmod +x third_party/lexbor_prebuilt/create_lexbor_aar.sh
          VER="${{ steps.tag.outputs.maven_version }}"
          third_party/lexbor_prebuilt/create_lexbor_aar.sh lexbor-android-layout "$VER" "lexbor-${VER}.aar"
          ls -la "lexbor-${VER}.aar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: lexbor Android ${{ steps.tag.outputs.release_tag }}
          make_latest: false
          body: |
            ## Archive Structure
            Prebuilt **lexbor** for Android (arm64-v8a, armeabi-v7a, x86, x86_64). Used by Offline e-document EPUB HTML extract in `react-native-sherpa-onnx`.
            - **lexbor-android.zip** – Layout: `arm64-v8a/`, `armeabi-v7a/`, `x86/`, `x86_64/` (`liblexbor.so`) and `include/` (C headers under `lexbor/`).
            - **lexbor-${{ steps.tag.outputs.maven_version }}.aar** – Android library (native libs + headers). Also on Maven as `com.xdcobra.sherpa:lexbor`.

            ## Maven
            The AAR is published to [GitHub Pages Maven](https://xdcobra.github.io/maven/) as `com.xdcobra.sherpa:lexbor` when `MAVEN_REPO_PAT` is set.

            ```gradle
            repositories {
                maven { url 'https://xdcobra.github.io/maven/' }
            }
            dependencies {
                implementation 'com.xdcobra.sherpa:lexbor:${{ steps.tag.outputs.maven_version }}'
            }
            ```

            Always-on for `extractDocumentText` (EPUB XHTML). No disable flag.
          files: |
            lexbor-android.zip
            lexbor-${{ steps.tag.outputs.maven_version }}.aar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish lexbor AAR to GitHub Pages Maven (XDcobra/maven)
        if: success()
        env:
          MAVEN_REPO_PAT: ${{ secrets.MAVEN_REPO_PAT }}
          MAVEN_VERSION: ${{ steps.tag.outputs.maven_version }}
          AAR_SRC: lexbor-${{ steps.tag.outputs.maven_version }}.aar
        run: |
          if [ -z "${MAVEN_REPO_PAT}" ]; then
            echo "MAVEN_REPO_PAT not set, skipping Maven publish."
            exit 0
          fi
          chmod +x third_party/lexbor_prebuilt/publish-maven/publish-to-github-pages.sh
          third_party/lexbor_prebuilt/publish-maven/publish-to-github-pages.sh

      - name: Summary
        run: |
          echo "## lexbor Android release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** [${{ steps.tag.outputs.release_tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`lexbor-android.zip\` | Layout: ABIs with liblexbor.so and \`include/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`lexbor-${{ steps.tag.outputs.maven_version }}.aar\` | Android library; Maven \`com.xdcobra.sherpa:lexbor\` when MAVEN_REPO_PAT is set |" >> $GITHUB_STEP_SUMMARY
