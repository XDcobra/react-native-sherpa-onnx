name: Test - JS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'readme.md'
      - '**/README.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-js
  cancel-in-progress: true

jobs:
  test-js:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install example dependencies (codegen)
        run: yarn install --immutable
        working-directory: example

      - name: Check iOS TurboModule signatures
        run: yarn check:ios-turbo-signatures

      - name: Check generated model language catalog
        run: yarn check:model-language-catalog

      - name: Run JS tests
        run: yarn test --ci
