# Host-side C++ tests (test/cpp): CMake builds GTest targets and runs ctest.
#
# - Audio: same android/src/.../jni/audio/*.cpp as Android, linked against system libav (Linux).
#   convert-file and f32le→format tests; MP3 cases skip if libshine is not in system FFmpeg (Ubuntu).
# - model_detect: STT/TTS model detection helpers.
# - ctc_alignment_host_test (Linux): ORT smoke + tiny stub + vocab units (no real pack).
#   Real EN golden (wav2vec2-base-960h-int8) lives in test-alignment-host.yml.

name: Test – host audio convert (C++)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'android/src/main/cpp/jni/audio/**'
      - 'android/src/main/cpp/alignment/**'
      - 'test/cpp/**'
      - 'test/fixtures/**'
      - '.github/workflows/test-audio-convert-host.yml'
  push:
    branches:
      - main
    paths:
      - 'android/src/main/cpp/jni/audio/**'
      - 'android/src/main/cpp/alignment/**'
      - 'test/cpp/**'
      - 'test/fixtures/**'
      - '.github/workflows/test-audio-convert-host.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-audio-host
  cancel-in-progress: true

jobs:
  audio-convert-host:
    name: Audio convert host tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libgtest-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev ffmpeg

      - name: Configure and build
        run: |
          mkdir -p test/cpp/build && cd test/cpp/build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Run host tests
        working-directory: ${{ github.workspace }}
        # ppocr_host_test → test-ocr-host.yml; CtcAlignmentGolden → test-alignment-host.yml
        run: |
          ctest --test-dir test/cpp/build --output-on-failure -R \
            '^(model_detect_test|diarization_core_test|speaker_embedding_core_test|audio_f32le_to_format_host_test)$'
          ./test/cpp/build/ctc_alignment_host_test \
            --gtest_filter='OrtSmoke*:WavFixture*:CtcAlignmentCore*:VocabProfile*'
