# Collect speech enhancement model assets from k2-fsa/sherpa-onnx speech-enhancement-models release.
# Mostly standalone .onnx files; streams are defined in scripts/ci/sherpa_speech_enhancement_model_release_streams.json
# (same pipeline as TTS: scripts/ci/collect_one_sherpa_release_stream.sh).
#
# To add another enhancement-related release: append to "streams" in that JSON.

name: Testdata - Collect speech enhancement model structures

on:
  workflow_dispatch:
    inputs:
      asset_limit:
        description: 'Max number of assets to process (0 or empty = no limit, process all)'
        required: false
        default: 0
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Collect speech enhancement release stream
        env:
          ASSET_LIMIT: ${{ inputs.asset_limit }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/collect_all_sherpa_model_streams.sh scripts/ci/collect_one_sherpa_release_stream.sh
          bash scripts/ci/collect_all_sherpa_model_streams.sh --config sherpa_speech_enhancement_model_release_streams.json

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            git add "$f"
          done < <(bash scripts/ci/collect_all_sherpa_model_streams.sh --config sherpa_speech_enhancement_model_release_streams.json --print-git-paths)
          git status --short
          if ! git diff --staged --quiet; then
            git commit -m "chore(testdata): update speech enhancement model structures, expected CSV, and license status from speech-enhancement-models release"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi
