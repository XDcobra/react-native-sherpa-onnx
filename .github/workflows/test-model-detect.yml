# Test Model Detect: CSV drift check + C++ model_detect_test (detect + validate suites).
#
# Allowed `feature` input values (must match scripts/ci/sherpa_model_detect_test_manifest.json):
#   all               — every feature × suite as parallel jobs (default)
#   asr               — ASR / STT (+ VAD fixtures)
#   tts               — TTS (+ language catalog check on detect)
#   enhancement       — Speech enhancement
#   separation        — Source separation (detect job also runs Separation* validation)
#   speaker-embedding — Speaker embedding / recognition
#   diarization       — Speaker diarization / segmentation
#   kws               — Keyword spotting
#
# Allowed `suite` input values:
#   all      — detect + validate where defined (default)
#   detect   — fixture / expected-CSV detection tests only
#   validate — ModelDetectValidation.* unit tests only
#
# pull_request to main always runs feature=all and suite=all.
# Diarization / speaker-embedding core binaries stay as separate reusable workflows
# (different C++ targets), gated by the same feature input.
# Runs in parallel with sdk-android, sdk-ios, sdk-sdk on pull_request.

name: Test – Full model detection

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      feature:
        description: 'Feature to test (all = every feature in parallel jobs)'
        required: false
        default: all
        type: choice
        options:
          - all
          - asr
          - tts
          - enhancement
          - separation
          - speaker-embedding
          - diarization
          - kws
      suite:
        description: 'Suite to run (all = detect + validate where defined)'
        required: false
        default: all
        type: choice
        options:
          - all
          - detect
          - validate

concurrency:
  group: test-model-detect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-csvs:
    name: Check CSV vs GitHub assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check model assets vs expected CSVs
        run: bash scripts/ci/check-model-csvs.sh
        # Script always exits 0; outputs warning if new assets are on GitHub but not in CSVs
        # In case of new assets available on Github, follow this procedure:
        # 0. Decide if the new assets are for models already supported
        # If yes:
        # 1. Run the collect workflows to update the CSVs
        # 2. Fill out the result column in the CSV with the expected model type
        # 3. Push and run this workflow again
        # If no:
        # 1. Open an issue on github to add support for this new model type
        # 2. Run the collect workflow to update the CSVs
        # 3. Fill out the result column in the CSV with "unsupported"
        # 4. Push and run this workflow again

  plan:
    name: Plan detect/validate matrix
    runs-on: ubuntu-latest
    outputs:
      feature: ${{ steps.plan.outputs.feature }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Plan matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          FEATURE: ${{ inputs.feature }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          feature="$(echo -n "${FEATURE:-all}" | xargs | tr '[:upper:]' '[:lower:]')"
          suite="$(echo -n "${SUITE:-all}" | xargs | tr '[:upper:]' '[:lower:]')"
          [[ -z "$feature" ]] && feature="all"
          [[ -z "$suite" ]] && suite="all"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            feature="all"
            suite="all"
          fi

          manifest="scripts/ci/sherpa_model_detect_test_manifest.json"
          allowed_features="$(jq -r '[.features[].id] | join(" ")' "$manifest")"
          if [[ "$feature" != "all" ]] && ! jq -e --arg id "$feature" '[.features[].id] | index($id) != null' "$manifest" >/dev/null; then
            echo "Invalid feature: '$feature'" >&2
            echo "Allowed: all $allowed_features" >&2
            exit 1
          fi
          case "$suite" in
            all|detect|validate) ;;
            *)
              echo "Invalid suite: '$suite' (allowed: all detect validate)" >&2
              exit 1
              ;;
          esac

          matrix="$(jq -c --arg feature "$feature" --arg suite "$suite" '
            [
              .features[]
              | select($feature == "all" or .id == $feature)
              | . as $feat
              | (
                  if ($suite == "all" or $suite == "detect") and ($feat.detect != null) then
                    {
                      id: $feat.id,
                      suite: "detect",
                      label: ($feat.label + " detect"),
                      gtest_filter: $feat.detect.gtest_filter,
                      check_language_catalog: ($feat.detect.check_language_catalog // false)
                    }
                  else empty end
                ),
                (
                  if ($suite == "all" or $suite == "validate") and ($feat.validate != null) then
                    {
                      id: $feat.id,
                      suite: "validate",
                      label: ($feat.label + " validate"),
                      gtest_filter: $feat.validate.gtest_filter,
                      check_language_catalog: false
                    }
                  else empty end
                )
            ]
          ' "$manifest")"

          if [[ "$matrix" == "[]" ]]; then
            echo "No jobs for feature='$feature' suite='$suite'" >&2
            exit 1
          fi

          echo "feature=$feature" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Jobs: $matrix"

  model-detect-test:
    name: ${{ matrix.label }}
    needs: [check-csvs, plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check generated model language catalog
        if: ${{ matrix.check_language_catalog }}
        run: yarn check:model-language-catalog

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libgtest-dev

      - name: Configure and build
        run: |
          mkdir -p test/cpp/build && cd test/cpp/build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --target model_detect_test

      - name: Run ${{ matrix.label }}
        working-directory: ${{ github.workspace }}
        run: |
          ./test/cpp/build/model_detect_test \
            --gtest_filter='${{ matrix.gtest_filter }}'

  diarization-core:
    name: Diarization core
    needs: [check-csvs, plan]
    if: ${{ needs.plan.outputs.feature == 'all' || needs.plan.outputs.feature == 'diarization' }}
    uses: ./.github/workflows/test-diarization-core.yml
    secrets: inherit

  speaker-embedding-core:
    name: Speaker embedding core
    needs: [check-csvs, plan]
    if: ${{ needs.plan.outputs.feature == 'all' || needs.plan.outputs.feature == 'speaker-embedding' }}
    uses: ./.github/workflows/test-speaker-embedding-core.yml
    secrets: inherit
