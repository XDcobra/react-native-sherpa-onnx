# Builds sherpa-onnx XCFramework for iOS (device + simulator) via build_sherpa_onnx_ios.sh.
# The framework includes the C++ API and espeak-ng N_PATH_HOME patch; see third_party/sherpa-onnx-prebuilt/build_sherpa_onnx_ios.sh.
name: Framework - Sherpa-Onnx (iOS) Release

on:
  workflow_dispatch:
    inputs:
      sherpa_onnx_version:
        description: 'sherpa-onnx version/tag to build (e.g. v1.12.24 or main). Leave empty to use third_party/sherpa-onnx-prebuilt/IOS_RELEASE_TAG (sherpa-onnx-ios-vX.Y.Z or sherpa-onnx-ios-vX.Y.Z-N).'
        required: false
        default: ''

jobs:
  build-framework:
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Set sherpa-onnx version
        id: version
        run: |
          IOS_TAG_PREFIX="sherpa-onnx-ios-v"
          if [ -n "${{ github.event.inputs.sherpa_onnx_version }}" ]; then
            VER="${{ github.event.inputs.sherpa_onnx_version }}"
            [ "${VER#v}" = "$VER" ] && VER="v$VER"
            VERSION_FULL="${VER#v}"
            VERSION_BASE="${VERSION_FULL%-*}"
            echo "version=${VERSION_FULL}" >> $GITHUB_OUTPUT
            echo "tag=$VER" >> $GITHUB_OUTPUT
            echo "release_tag=${IOS_TAG_PREFIX}${VERSION_FULL}" >> $GITHUB_OUTPUT
            echo "Using sherpa-onnx version: $VER (release: ${IOS_TAG_PREFIX}${VERSION_FULL})"
          else
            TAG_FILE=third_party/sherpa-onnx-prebuilt/IOS_RELEASE_TAG
            if [ ! -f "$TAG_FILE" ]; then
              echo "::error::No input version and $TAG_FILE missing"
              exit 1
            fi
            TAG=$(grep -v '^#' "$TAG_FILE" | grep -v '^[[:space:]]*$' | head -1 | tr -d '\r\n')
            if [ -z "$TAG" ] || [ "${TAG#$IOS_TAG_PREFIX}" = "$TAG" ]; then
              echo "::error::IOS_RELEASE_TAG must be set to ${IOS_TAG_PREFIX}X.Y.Z or ${IOS_TAG_PREFIX}X.Y.Z-N (with optional build number)"
              exit 1
            fi
            VERSION_FULL="${TAG#$IOS_TAG_PREFIX}"
            VERSION_BASE="${VERSION_FULL%-*}"
            if [ "$VERSION_BASE" = "$VERSION_FULL" ]; then
              TAG_REF="v${VERSION_FULL}"
            else
              TAG_REF="v${VERSION_BASE}"
            fi
            echo "version=${VERSION_FULL}" >> $GITHUB_OUTPUT
            echo "tag=$TAG_REF" >> $GITHUB_OUTPUT
            echo "release_tag=$TAG" >> $GITHUB_OUTPUT
            echo "Using sherpa-onnx version: $VERSION_FULL (clone: $TAG_REF, release: $TAG)"
          fi

      - name: Install CMake
        run: |
          brew install cmake

      - name: Build sherpa-onnx XCFramework
        run: |
          cd third_party/sherpa-onnx-prebuilt
          chmod +x build_sherpa_onnx_ios.sh
          ./build_sherpa_onnx_ios.sh ${{ steps.version.outputs.tag }}

      - name: Prepare framework directory
        run: |
          mkdir -p ios/Frameworks
          SOURCE="third_party/sherpa-onnx-prebuilt/sherpa_onnx.xcframework"
          if [ ! -d "$SOURCE" ]; then
            echo "Error: Build script did not produce $SOURCE"
            ls -la third_party/sherpa-onnx-prebuilt/ || true
            exit 1
          fi
          rm -rf ios/Frameworks/sherpa_onnx.xcframework
          cp -R "$SOURCE" ios/Frameworks/sherpa_onnx.xcframework
          echo "Framework copied to ios/Frameworks/sherpa_onnx.xcframework"
          du -sh ios/Frameworks/sherpa_onnx.xcframework

      - name: Verify library sizes
        run: |
          echo "Verifying library sizes contain ONNX Runtime..."
          MIN_SIZE=52428800  # 50MB in bytes - libraries with ONNX Runtime should be >50MB

          DEVICE_LIB="ios/Frameworks/sherpa_onnx.xcframework/ios-arm64/libsherpa-onnx.a"
          SIM_LIB="ios/Frameworks/sherpa_onnx.xcframework/ios-arm64_x86_64-simulator/libsherpa-onnx.a"

          for lib in "$DEVICE_LIB" "$SIM_LIB"; do
            if [ ! -f "$lib" ]; then
              echo "ERROR: Library not found: $lib"
              echo "Contents of ios/Frameworks/sherpa_onnx.xcframework:"
              find ios/Frameworks/sherpa_onnx.xcframework -type f -name "*.a" 2>/dev/null || echo "No .a files found!"
              exit 1
            fi
            
            size_bytes=$(stat -f%z "$lib" 2>/dev/null || stat -c%s "$lib")
            size_human=$(ls -lh "$lib" | awk '{print $5}')
            
            echo "  $lib: $size_human ($size_bytes bytes)"
            
            if [ "$size_bytes" -lt "$MIN_SIZE" ]; then
              echo ""
              echo "ERROR: Library is too small! ONNX Runtime was NOT properly merged."
              echo "  Expected: >50MB"
              echo "  Got: $size_human"
              echo ""
              echo "This indicates a problem with the 'Add ONNX Runtime to XCFramework' step."
              exit 1
            fi
          done

          echo ""
          echo "SUCCESS: Both libraries are correctly sized with ONNX Runtime included."

      - name: Create version info file
        run: |
          cat > ios/Frameworks/sherpa_onnx.xcframework/VERSION.txt << EOF
          sherpa-onnx version: ${{ steps.version.outputs.release_tag }}
          Built on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          GitHub Actions Run: ${{ github.run_id }}
          Commit: ${{ github.sha }}
          EOF
          cat ios/Frameworks/sherpa_onnx.xcframework/VERSION.txt

      - name: Upload XCFramework as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sherpa-onnx-xcframework-${{ steps.version.outputs.release_tag }}
          path: ios/Frameworks/sherpa_onnx.xcframework
          retention-days: 90
          compression-level: 6

      - name: Create framework archive
        run: |
          cd ios/Frameworks
          zip -r sherpa_onnx.xcframework.zip sherpa_onnx.xcframework
          cd ../..
          ls -lh ios/Frameworks/sherpa_onnx.xcframework.zip

      - name: Upload framework archive as artifact
        uses: actions/upload-artifact@v7
        with:
          name: sherpa-onnx-xcframework-zip-${{ steps.version.outputs.release_tag }}
          path: ios/Frameworks/sherpa_onnx.xcframework.zip
          retention-days: 90

      - name: Create GitHub Release with Framework
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: sherpa-onnx iOS Framework ${{ steps.version.outputs.release_tag }}
          make_latest: false
          body: |
            This release contains the prebuilt sherpa-onnx XCFramework for iOS development with ONNX Runtime support.

            ## Automatic Installation

            If you're using the `react-native-sherpa-onnx` SDK, the iOS framework is downloaded automatically during `pod install`. No manual setup required!

            ## Manual Installation

            1. Download `sherpa_onnx.xcframework.zip` from the Assets below
            2. Extract it:
               ```bash
               unzip sherpa_onnx.xcframework.zip
               ```
            3. Copy to your project:
               ```bash
               cp -r sherpa_onnx.xcframework /path/to/react-native-sherpa-onnx/ios/Frameworks/
               ```
            4. Run `pod install` in the example directory

            ## Framework Details

            - **Version:** ${{ steps.version.outputs.release_tag }}
            - **Architectures:** arm64 (device), arm64 + x86_64 (simulator)
            - **iOS Deployment Target:** 13.0+
            - **ONNX Runtime:** Included in this build

            ## Build Information
            - **GitHub Actions Run:** ${{ github.run_id }}
            - **Commit:** ${{ github.sha }}
          files: ios/Frameworks/sherpa_onnx.xcframework.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## sherpa-onnx XCFramework Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.release_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework Location:** \`ios/Frameworks/sherpa_onnx.xcframework\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release:** [${{ steps.version.outputs.release_tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation Methods" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Automatic (Recommended):**" >> $GITHUB_STEP_SUMMARY
          echo "```bash" >> $GITHUB_STEP_SUMMARY
          echo "pod install  # Framework downloads automatically" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Manual:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download from [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract: \`unzip sherpa_onnx.xcframework.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Copy: \`cp -r sherpa_onnx.xcframework ios/Frameworks/\`" >> $GITHUB_STEP_SUMMARY
