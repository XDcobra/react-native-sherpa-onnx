# Collect all configured sherpa-onnx model streams in one run (recommended for bulk refresh).
# Runs configs from scripts/ci/sherpa_model_collect_manifest.json sequentially and creates
# a single commit. Shares concurrency with per-stream workflows — only one collect runs per ref.

name: Testdata - Collect all model structures

on:
  workflow_dispatch:
    inputs:
      asset_limit:
        description: 'Max number of assets to process per stream (0 or empty = no limit)'
        required: false
        default: 0
        type: number

concurrency:
  group: collect-model-structures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Collect all release streams
        env:
          ASSET_LIMIT: ${{ inputs.asset_limit }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/collect_all_sherpa_model_streams.sh \
            scripts/ci/collect_one_sherpa_release_stream.sh \
            scripts/ci/git_commit_collect_changes.sh
          mapfile -t configs < <(jq -r '.configs[]' scripts/ci/sherpa_model_collect_manifest.json)
          for cfg in "${configs[@]}"; do
            echo "=== Collecting $cfg ==="
            bash scripts/ci/collect_all_sherpa_model_streams.sh --config "$cfg"
          done

      - name: Commit and push if changed
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/ci/git_commit_collect_changes.sh \
            --message "chore(testdata): update all model structures, expected CSVs, and license status from sherpa-onnx releases" \
            --manifest scripts/ci/sherpa_model_collect_manifest.json
