// Prebuilt download and check logic. Applied after android {} and configurations.
// Depends on: sherpaOnnxVersion, ffmpegVersion, libarchiveVersion, ortVersion (from prebuilt-versions.gradle)
// and configurations.sherpaOnnxAar, ffmpegAar, libarchiveAar, onnxruntimeAar (from build.gradle).
//
// Logging (downloadNativeLibsIfNeeded): each line is tagged [prebuilt], [sherpa-onnx], [FFmpeg], [libarchive], or [onnxruntime].
// Sources are labeled (1) LOCAL skip / supplemental copy, (2) MAVEN AAR, (3) GITHUB release zip.
// When sherpaOnnxDisableFfmpeg=true (gradle.properties), FFmpeg is not required; see docs/disable-ffmpeg.md.
// When sherpaOnnxDisableLibarchive=true (gradle.properties), libarchive is not required; see docs/disable-libarchive.md.

def sherpaOnnxDisableFfmpeg = (project.findProperty("sherpaOnnxDisableFfmpeg") ?: "false").toString().toLowerCase() in ["true", "1"]
def sherpaOnnxDisableLibarchive = (project.findProperty("sherpaOnnxDisableLibarchive") ?: "false").toString().toLowerCase() in ["true", "1"]

def requiredAbis = ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]
def requiredFfmpegSoFiles = [
  'libavcodec.so', 'libavformat.so', 'libavutil.so', 'libswresample.so', 'libavfilter.so', 'libshine.so'
]
def requiredSherpaOnnxSoFiles = [
  'libsherpa-onnx-jni.so', 'libsherpa-onnx-c-api.so', 'libsherpa-onnx-cxx-api.so', 'libonnxruntime.so'
]
def requiredLibarchiveSoFiles = ['libarchive.so', 'libzstd.so']
def requiredOnnxruntimeJniSoFiles = ['libonnxruntime4j_jni.so']

def jniLibsDir = file("${project.projectDir}/src/main/jniLibs")
def sherpaOnnxClassesDir = file("${project.buildDir}/sherpa-onnx-classes")
def onnxruntimeClassesDir = file("${project.buildDir}/onnxruntime-classes")

def hasAllFfmpegLibs = {
  for (abi in requiredAbis) {
    def dir = new File(jniLibsDir, abi)
    if (!dir.exists()) return false
    for (soName in requiredFfmpegSoFiles) {
      if (!new File(dir, soName).exists()) return false
    }
  }
  return true
}

def hasAllSherpaLibs = {
  for (abi in requiredAbis) {
    def dir = new File(jniLibsDir, abi)
    if (!dir.exists()) return false
    for (soName in requiredSherpaOnnxSoFiles) {
      if (!new File(dir, soName).exists()) return false
    }
  }
  return true
}

def hasSherpaHeaders = {
  return new File(project.projectDir, "src/main/cpp/include/sherpa-onnx/c-api/c-api.h").exists()
}

def hasAllLibarchiveLibs = {
  for (abi in requiredAbis) {
    def dir = new File(jniLibsDir, abi)
    if (!dir.exists()) return false
    for (soName in requiredLibarchiveSoFiles) {
      if (!new File(dir, soName).exists()) return false
    }
  }
  return true
}

def hasFfmpegHeaders = {
  return new File(project.projectDir, "src/main/cpp/include/ffmpeg/libavcodec/avcodec.h").exists()
}

def hasLibarchiveHeaders = {
  return new File(project.projectDir, "src/main/cpp/include/libarchive/archive.h").exists()
}

def hasAllOnnxruntimeJniLibs = {
  for (abi in requiredAbis) {
    def dir = new File(jniLibsDir, abi)
    if (!dir.exists()) return false
    for (soName in requiredOnnxruntimeJniSoFiles) {
      if (!new File(dir, soName).exists()) return false
    }
  }
  return true
}

def getGitHubRepo = {
  try {
    def proc = ['git', 'remote', 'get-url', 'origin'].execute(null, project.rootDir)
    proc.waitFor()
    if (proc.exitValue() != 0) return null
    def url = proc.text.trim()
    def m = (url =~ /github\.com[:\/]([^\/]+\/[^\/\s]+?)(\.git)?$/)
    return m ? m[0][1] : null
  } catch (Exception e) { return null }
}

def readReleaseTag = { File tagFile ->
  if (!tagFile.exists()) return null
  return tagFile.text.split(/\r?\n/).findResult { line ->
    def t = line.replaceAll(/\s*#.*$/, '').trim()
    t ? t : null
  }
}

/** Which .so files are missing under jniLibs for one ABI (for diagnostics). */
def listMissingSoInAbi = { File abiDir, List<String> required ->
  if (!abiDir.exists()) return required
  required.findAll { soName -> !new File(abiDir, soName).exists() }
}

/** First ABI dir that is incomplete for the given required list, or null if all OK. */
def firstAbiWithMissingLibs = { List<String> required ->
  for (abi in requiredAbis) {
    def abiDir = new File(jniLibsDir, abi)
    def missing = listMissingSoInAbi(abiDir, required)
    if (!missing.isEmpty()) return [abi, missing]
  }
  return null
}

project.tasks.register("downloadNativeLibsIfNeeded") {
  doLast {
    def downloadDir = file("${project.buildDir}/prebuilt-downloads")
    def jniLibsHuman = "${project.projectDir}/src/main/jniLibs"
    def sherpaHeaderPath = "src/main/cpp/include/sherpa-onnx/c-api/c-api.h"
    def ffmpegHeaderPath = "src/main/cpp/include/ffmpeg/libavcodec/avcodec.h"
    def libarchiveHeaderPath = "src/main/cpp/include/libarchive/archive.h"

    def currentSherpaVersion = project.ext.sherpaOnnxVersion
    def sherpaVersionFile = new File(downloadDir, "sherpa-onnx-version.txt")
    def storedSherpaVersion = (sherpaVersionFile.exists() ? sherpaVersionFile.text.trim() : null)
    def sherpaLibsOk = hasAllSherpaLibs()
    def sherpaHdrsOk = hasSherpaHeaders()
    def sherpaNeedsUpdate = !sherpaLibsOk || !sherpaHdrsOk || storedSherpaVersion == null || storedSherpaVersion != currentSherpaVersion

    def currentFfmpegVersion = project.ext.ffmpegVersion
    def ffmpegVersionFile = new File(downloadDir, "ffmpeg-version.txt")
    def storedFfmpegVersion = (ffmpegVersionFile.exists() ? ffmpegVersionFile.text.trim() : null)
    def ffmpegLibsOk = hasAllFfmpegLibs()
    def ffmpegHdrsOk = hasFfmpegHeaders()
    def ffmpegNeedsUpdate = !ffmpegLibsOk || !ffmpegHdrsOk || storedFfmpegVersion == null || storedFfmpegVersion != currentFfmpegVersion

    def currentLibarchiveVersion = project.ext.libarchiveVersion
    def libarchiveVersionFile = new File(downloadDir, "libarchive-version.txt")
    def storedLibarchiveVersion = (libarchiveVersionFile.exists() ? libarchiveVersionFile.text.trim() : null)
    def libarchiveLibsOk = hasAllLibarchiveLibs()
    def libarchiveHdrsOk = hasLibarchiveHeaders()
    def libarchiveNeedsUpdate = !libarchiveLibsOk || !libarchiveHdrsOk || storedLibarchiveVersion == null || storedLibarchiveVersion != currentLibarchiveVersion

    println "[prebuilt] downloadNativeLibsIfNeeded: use local .so/headers/stamps if complete; else Maven AAR; else GitHub."

    // --- sherpa-onnx diagnostics ---
    if (!sherpaNeedsUpdate) {
      println "[sherpa-onnx] source: (1) LOCAL — skip fetch. jniLibs + ${sherpaHeaderPath} OK, stamp ${sherpaVersionFile.name}=${currentSherpaVersion}"
    } else {
      println "[sherpa-onnx] update needed (would use Maven first, then GitHub if required). Reasons:"
      if (!sherpaLibsOk) {
        def gap = firstAbiWithMissingLibs(requiredSherpaOnnxSoFiles)
        if (gap) {
          println "[sherpa-onnx]   • jniLibs incomplete: ABI '${gap[0]}' missing: ${gap[1].join(', ')}"
        } else {
          println "[sherpa-onnx]   • jniLibs: one or more ABI dirs or required .so missing (${requiredSherpaOnnxSoFiles.join(', ')})"
        }
      }
      if (!sherpaHdrsOk) {
        println "[sherpa-onnx]   • headers: ${sherpaHeaderPath} missing → often fixed by Maven/GitHub extract"
      }
      if (storedSherpaVersion == null) {
        println "[sherpa-onnx]   • version stamp: ${sherpaVersionFile.name} missing → common after ./gradlew clean"
      } else if (storedSherpaVersion != currentSherpaVersion) {
        println "[sherpa-onnx]   • version stamp: stored '${storedSherpaVersion}' != gradle sherpaOnnxVersion '${currentSherpaVersion}'"
      }
    }

    // --- FFmpeg ---
    if (sherpaOnnxDisableFfmpeg) {
      println "[FFmpeg] skipped (sherpaOnnxDisableFfmpeg=true)"
    } else if (!ffmpegNeedsUpdate) {
      println "[FFmpeg] source: (1) LOCAL — skip fetch. jniLibs + ${ffmpegHeaderPath} OK, stamp ${ffmpegVersionFile.name}=${currentFfmpegVersion}"
    } else {
      println "[FFmpeg] update needed. Reasons:"
      if (!ffmpegLibsOk) {
        def gap = firstAbiWithMissingLibs(requiredFfmpegSoFiles)
        if (gap) {
          println "[FFmpeg]   • jniLibs incomplete: ABI '${gap[0]}' missing: ${gap[1].join(', ')}"
        } else {
          println "[FFmpeg]   • jniLibs: required FFmpeg .so missing for an ABI"
        }
      }
      if (!ffmpegHdrsOk) {
        println "[FFmpeg]   • headers: ${ffmpegHeaderPath} missing"
      }
      if (storedFfmpegVersion == null) {
        println "[FFmpeg]   • version stamp: ${ffmpegVersionFile.name} missing"
      } else if (storedFfmpegVersion != currentFfmpegVersion) {
        println "[FFmpeg]   • version stamp: stored '${storedFfmpegVersion}' != gradle ffmpegVersion '${currentFfmpegVersion}'"
      }
    }

    // --- libarchive ---
    if (sherpaOnnxDisableLibarchive) {
      println "[libarchive] skipped (sherpaOnnxDisableLibarchive=true)"
    } else if (!libarchiveNeedsUpdate) {
      println "[libarchive] source: (1) LOCAL — skip fetch. jniLibs + ${libarchiveHeaderPath} OK, stamp ${libarchiveVersionFile.name}=${currentLibarchiveVersion}"
    } else {
      println "[libarchive] update needed. Reasons:"
      if (!libarchiveLibsOk) {
        def gap = firstAbiWithMissingLibs(requiredLibarchiveSoFiles)
        if (gap) {
          println "[libarchive]   • jniLibs incomplete: ABI '${gap[0]}' missing: ${gap[1].join(', ')}"
        } else {
          println "[libarchive]   • jniLibs: libarchive/libzstd .so missing for an ABI"
        }
      }
      if (!libarchiveHdrsOk) {
        println "[libarchive]   • headers: ${libarchiveHeaderPath} missing"
      }
      if (storedLibarchiveVersion == null) {
        println "[libarchive]   • version stamp: ${libarchiveVersionFile.name} missing"
      } else if (storedLibarchiveVersion != currentLibarchiveVersion) {
        println "[libarchive]   • version stamp: stored '${storedLibarchiveVersion}' != gradle libarchiveVersion '${currentLibarchiveVersion}'"
      }
    }

    // --- onnxruntime JNI (Maven only in this task) ---
    def ortJniOk = hasAllOnnxruntimeJniLibs()
    if (!ortJniOk) {
      def gap = firstAbiWithMissingLibs(requiredOnnxruntimeJniSoFiles)
      println "[onnxruntime] update needed for JNI bridge only (libonnxruntime.so stays from sherpa prebuilts). Reasons:"
      if (gap) {
        println "[onnxruntime]   • jniLibs: ABI '${gap[0]}' missing: ${gap[1].join(', ')}"
      } else {
        println "[onnxruntime]   • jniLibs: ${requiredOnnxruntimeJniSoFiles.join(', ')} missing for an ABI"
      }
      println "[onnxruntime]   • source will be: (2) MAVEN AAR (onnxruntime) — only libonnxruntime4j_jni.so extracted"
    } else {
      println "[onnxruntime] source: (1) LOCAL — libonnxruntime4j_jni.so present for all ABIs; no JNI extract"
    }
    println ""

    def sherpaUpdatedFromAar = [false]
    def ffmpegUpdatedFromAar = [false]
    def libarchiveUpdatedFromAar = [false]
    if (sherpaNeedsUpdate) {
      try {
        def aarFiles = project.configurations.sherpaOnnxAar.files
        if (!aarFiles.isEmpty()) {
          downloadDir.mkdirs()
          def aar = aarFiles.iterator().next()
          def aarExtractDir = new File(downloadDir, "sherpa-onnx-aar-extract")
          if (aarExtractDir.exists()) aarExtractDir.deleteDir()
          aarExtractDir.mkdirs()
          copy { from zipTree(aar); into aarExtractDir }
          requiredAbis.each { abi ->
            def aarJniDir = new File(aarExtractDir, "jni/${abi}")
            if (aarJniDir.exists()) {
              copy { from aarJniDir; into new File(jniLibsDir, abi) }
            }
          }
          def includeSherpaDir = file("${project.projectDir}/src/main/cpp/include/sherpa-onnx")
          def aarCapiDir = new File(aarExtractDir, "c-api")
          def copiedHeaders = false
          if (aarCapiDir.exists()) {
            includeSherpaDir.mkdirs()
            copy { from fileTree(aarExtractDir) { include 'c-api/**' }; into includeSherpaDir }
            copiedHeaders = true
          }
          downloadDir.mkdirs()
          sherpaVersionFile.text = currentSherpaVersion
          sherpaUpdatedFromAar[0] = true
          println "[sherpa-onnx] applied: (2) MAVEN AAR — artifact ${aar.name}"
          println "[sherpa-onnx]   from: configuration sherpaOnnxAar → extracted ${aarExtractDir}"
          println "[sherpa-onnx]   into jniLibs: AAR jni/<abi>/*.so → ${jniLibsHuman}/<abi>/"
          println "[sherpa-onnx]   into headers: ${copiedHeaders ? 'c-api/** → ' + includeSherpaDir : '(no c-api/ in AAR — headers unchanged)'}"
          println "[sherpa-onnx]   stamp written: ${sherpaVersionFile.absolutePath} = ${currentSherpaVersion}"
        } else {
          println "[sherpa-onnx] (2) MAVEN: sherpaOnnxAar resolved empty — will try (3) GitHub if repo is set"
        }
      } catch (Exception e) {
        println "[sherpa-onnx] (2) MAVEN failed: ${e.message} — will try (3) GitHub if repo is set"
      }
    }

    if (!sherpaOnnxDisableFfmpeg && ffmpegNeedsUpdate) {
      try {
        def aarFiles = project.configurations.ffmpegAar.files
        if (!aarFiles.isEmpty()) {
          downloadDir.mkdirs()
          def aar = aarFiles.iterator().next()
          def aarExtractDir = new File(downloadDir, "ffmpeg-aar-extract")
          if (aarExtractDir.exists()) aarExtractDir.deleteDir()
          aarExtractDir.mkdirs()
          copy { from zipTree(aar); into aarExtractDir }
          requiredAbis.each { abi ->
            def aarJniDir = new File(aarExtractDir, "jni/${abi}")
            if (aarJniDir.exists()) {
              copy { from aarJniDir; into new File(jniLibsDir, abi) }
            }
          }
          def ffmpegIncludeDir = file("${project.projectDir}/src/main/cpp/include/ffmpeg")
          def aarIncludeDir = new File(aarExtractDir, "include")
          def copiedHdr = false
          if (aarIncludeDir.exists()) {
            ffmpegIncludeDir.mkdirs()
            copy { from aarIncludeDir; into ffmpegIncludeDir }
            copiedHdr = true
          }
          downloadDir.mkdirs()
          ffmpegVersionFile.text = currentFfmpegVersion
          ffmpegUpdatedFromAar[0] = true
          println "[FFmpeg] applied: (2) MAVEN AAR — artifact ${aar.name}"
          println "[FFmpeg]   from: configuration ffmpegAar → ${aarExtractDir}"
          println "[FFmpeg]   into jniLibs: jni/<abi>/*.so → ${jniLibsHuman}/<abi>/"
          println "[FFmpeg]   into headers: ${copiedHdr ? 'include/** → ' + ffmpegIncludeDir : '(no include/ in AAR)'}"
          println "[FFmpeg]   stamp: ${ffmpegVersionFile.absolutePath} = ${currentFfmpegVersion}"
        } else {
          println "[FFmpeg] (2) MAVEN: ffmpegAar empty — will try (3) GitHub if repo is set"
        }
      } catch (Exception e) {
        println "[FFmpeg] (2) MAVEN failed: ${e.message} — will try (3) GitHub if repo is set"
      }
    }

    if (!sherpaOnnxDisableLibarchive && libarchiveNeedsUpdate) {
      try {
        def aarFiles = project.configurations.libarchiveAar.files
        if (!aarFiles.isEmpty()) {
          downloadDir.mkdirs()
          def aar = aarFiles.iterator().next()
          def aarExtractDir = new File(downloadDir, "libarchive-aar-extract")
          if (aarExtractDir.exists()) aarExtractDir.deleteDir()
          aarExtractDir.mkdirs()
          copy { from zipTree(aar); into aarExtractDir }
          requiredAbis.each { abi ->
            def aarJniDir = new File(aarExtractDir, "jni/${abi}")
            if (aarJniDir.exists()) {
              copy { from aarJniDir; into new File(jniLibsDir, abi) }
            }
          }
          def libarchiveIncludeDir = file("${project.projectDir}/src/main/cpp/include/libarchive")
          def aarIncludeDir = new File(aarExtractDir, "include")
          def copiedHdr = false
          if (aarIncludeDir.exists()) {
            libarchiveIncludeDir.mkdirs()
            copy { from aarIncludeDir; into libarchiveIncludeDir }
            copiedHdr = true
          }
          downloadDir.mkdirs()
          libarchiveVersionFile.text = currentLibarchiveVersion
          libarchiveUpdatedFromAar[0] = true
          println "[libarchive] applied: (2) MAVEN AAR — artifact ${aar.name}"
          println "[libarchive]   from: configuration libarchiveAar → ${aarExtractDir}"
          println "[libarchive]   into jniLibs: jni/<abi>/*.so → ${jniLibsHuman}/<abi>/"
          println "[libarchive]   into headers: ${copiedHdr ? 'include/** → ' + libarchiveIncludeDir : '(no include/ in AAR)'}"
          println "[libarchive]   stamp: ${libarchiveVersionFile.absolutePath} = ${currentLibarchiveVersion}"
        } else {
          println "[libarchive] (2) MAVEN: libarchiveAar empty — will try (3) GitHub if repo is set"
        }
      } catch (Exception e) {
        println "[libarchive] (2) MAVEN failed: ${e.message} — will try (3) GitHub if repo is set"
      }
    }

    // onnxruntime AAR: extract only libonnxruntime4j_jni.so (the Java↔C bridge)
    // into jniLibs. We do NOT extract libonnxruntime.so from this AAR because
    // jniLibs already has it from the sherpa-onnx prebuilts — avoids duplicates.
    if (!hasAllOnnxruntimeJniLibs()) {
      try {
        def aarFiles = project.configurations.onnxruntimeAar.files
        if (!aarFiles.isEmpty()) {
          downloadDir.mkdirs()
          def aar = aarFiles.iterator().next()
          def aarExtractDir = new File(downloadDir, "onnxruntime-aar-extract")
          if (aarExtractDir.exists()) aarExtractDir.deleteDir()
          aarExtractDir.mkdirs()
          copy { from zipTree(aar); into aarExtractDir }
          requiredAbis.each { abi ->
            def aarJniDir = new File(aarExtractDir, "jni/${abi}")
            if (aarJniDir.exists()) {
              copy {
                from aarJniDir
                include 'libonnxruntime4j_jni.so'
                into new File(jniLibsDir, abi)
              }
            }
          }
          println "[onnxruntime] applied: (2) MAVEN AAR — artifact ${aar.name}"
          println "[onnxruntime]   from: configuration onnxruntimeAar → ${aarExtractDir}"
          println "[onnxruntime]   into jniLibs: only libonnxruntime4j_jni.so per ABI → ${jniLibsHuman}/<abi>/"
        } else {
          println "[onnxruntime] (2) MAVEN: onnxruntimeAar empty — JNI bridge still missing"
        }
      } catch (Exception e) {
        println "[onnxruntime] (2) MAVEN failed: ${e.message}"
      }
    }

    def repo = project.findProperty('prebuiltGitHubRepo') ?: getGitHubRepo()
    if (!repo) {
      def needFfmpeg = !sherpaOnnxDisableFfmpeg && ffmpegNeedsUpdate && !ffmpegUpdatedFromAar[0]
      def needLibarchive = !sherpaOnnxDisableLibarchive && libarchiveNeedsUpdate && !libarchiveUpdatedFromAar[0]
      def needSherpa = sherpaNeedsUpdate && !sherpaUpdatedFromAar[0]
      if (needFfmpeg || needLibarchive || needSherpa) {
        println "[prebuilt] (3) GITHUB skipped: no repo (set -PprebuiltGitHubRepo=owner/repo or use a git remote pointing at github.com)"
        println "[prebuilt]   still unresolved: sherpa=${needSherpa}, ffmpeg=${needFfmpeg}, libarchive=${needLibarchive}"
        def diag = [
          "prebuiltGitHubRepo=${project.findProperty('prebuiltGitHubRepo') ?: '(not set)'}",
          "git remote origin=${getGitHubRepo() ?: '(not a GitHub URL or git unavailable)'}",
          "sherpaOnnxDisableFfmpeg=${sherpaOnnxDisableFfmpeg}",
          "sherpaOnnxDisableLibarchive=${sherpaOnnxDisableLibarchive}",
          "sherpaNeedsUpdate=${sherpaNeedsUpdate} sherpaUpdatedFromAar=${sherpaUpdatedFromAar[0]}",
          "ffmpegNeedsUpdate=${ffmpegNeedsUpdate} ffmpegUpdatedFromAar=${ffmpegUpdatedFromAar[0]}",
          "libarchiveNeedsUpdate=${libarchiveNeedsUpdate} libarchiveUpdatedFromAar=${libarchiveUpdatedFromAar[0]}",
          "needFfmpeg=${needFfmpeg} needLibarchive=${needLibarchive} needSherpa=${needSherpa}"
        ].join(", ")
        throw new RuntimeException(
          "Native libs/headers still missing and GitHub repo unknown. " +
          "Set -PprebuiltGitHubRepo=owner/repo or ensure git remote origin is a GitHub URL. " +
          "Use Maven (com.xdcobra.sherpa:ffmpeg / sherpa-onnx / libarchive), run a Gradle Android build so prebuilts download, or ensure ANDROID_RELEASE_TAG GitHub releases exist. " +
          (sherpaOnnxDisableFfmpeg ? "(FFmpeg disabled via sherpaOnnxDisableFfmpeg=true.) " : "") +
          (sherpaOnnxDisableLibarchive ? "(libarchive disabled via sherpaOnnxDisableLibarchive=true.) " : "") +
          "Diagnostics: [${diag}]"
        )
      }
      return
    }
    def willUseGithub = (!sherpaOnnxDisableFfmpeg && ffmpegNeedsUpdate && !ffmpegUpdatedFromAar[0]) ||
        (!sherpaOnnxDisableLibarchive && libarchiveNeedsUpdate && !libarchiveUpdatedFromAar[0]) ||
        (sherpaNeedsUpdate && !sherpaUpdatedFromAar[0])
    if (willUseGithub) {
      println "[prebuilt] (3) GITHUB: will download release zips from https://github.com/${repo}/releases/download/<tag>/…"
    }
    def baseUrl = "https://github.com/${repo}/releases/download"
    downloadDir.mkdirs()

    if (!sherpaOnnxDisableFfmpeg && ffmpegNeedsUpdate && !ffmpegUpdatedFromAar[0]) {
      def tagFile = file("${project.projectDir.parent}/third_party/ffmpeg_prebuilt/ANDROID_RELEASE_TAG")
      def tag = readReleaseTag(tagFile)
      if (!tag) throw new RuntimeException("Missing or empty third_party/ffmpeg_prebuilt/ANDROID_RELEASE_TAG")
      def zipFile = new File(downloadDir, "ffmpeg-android.zip")
      def url = "${baseUrl}/${tag}/ffmpeg-android.zip"
      project.exec { commandLine 'curl', '-sSL', '-o', zipFile, url; workingDir project.projectDir }
      if (!zipFile.exists() || zipFile.length() == 0) throw new RuntimeException("Download failed or empty: ${url}")
      def ffmpegExtractDir = new File(downloadDir, "ffmpeg-extract")
      if (ffmpegExtractDir.exists()) ffmpegExtractDir.deleteDir()
      ffmpegExtractDir.mkdirs()
      copy { from zipTree(zipFile); into ffmpegExtractDir }
      copy {
        from fileTree(ffmpegExtractDir) { include 'arm64-v8a/**', 'armeabi-v7a/**', 'x86/**', 'x86_64/**' }
        into jniLibsDir
      }
      def ffmpegIncludeDir = file("${project.projectDir}/src/main/cpp/include/ffmpeg")
      def ffmpegIncludeInZip = new File(ffmpegExtractDir, "include")
      if (ffmpegIncludeInZip.exists()) {
        copy { from fileTree(ffmpegIncludeInZip); into ffmpegIncludeDir }
      }
      downloadDir.mkdirs()
      ffmpegVersionFile.text = currentFfmpegVersion
      println "[FFmpeg] applied: (3) GITHUB RELEASE — tag ${tag}"
      println "[FFmpeg]   url: ${url}"
      println "[FFmpeg]   into jniLibs: <abi>/*.so from zip → ${jniLibsHuman}/"
      println "[FFmpeg]   into headers: include/** → ${ffmpegIncludeDir} (if present in zip)"
      println "[FFmpeg]   stamp: ${ffmpegVersionFile.absolutePath} = ${currentFfmpegVersion}"
    }

    if (!sherpaOnnxDisableLibarchive && libarchiveNeedsUpdate && !libarchiveUpdatedFromAar[0]) {
      def tagFile = file("${project.projectDir.parent}/third_party/libarchive_prebuilt/ANDROID_RELEASE_TAG")
      def tag = readReleaseTag(tagFile)
      if (!tag) throw new RuntimeException("Missing or empty third_party/libarchive_prebuilt/ANDROID_RELEASE_TAG")
      def zipFile = new File(downloadDir, "libarchive-android.zip")
      def url = "${baseUrl}/${tag}/libarchive-android.zip"
      project.exec { commandLine 'curl', '-sSL', '-o', zipFile, url; workingDir project.projectDir }
      if (!zipFile.exists() || zipFile.length() == 0) throw new RuntimeException("Download failed or empty: ${url}")
      def libarchiveExtractDir = new File(downloadDir, "libarchive-extract")
      if (libarchiveExtractDir.exists()) libarchiveExtractDir.deleteDir()
      libarchiveExtractDir.mkdirs()
      copy { from zipTree(zipFile); into libarchiveExtractDir }
      copy {
        from fileTree(libarchiveExtractDir) { include 'arm64-v8a/**', 'armeabi-v7a/**', 'x86/**', 'x86_64/**' }
        into jniLibsDir
      }
      def libarchiveIncludeDir = file("${project.projectDir}/src/main/cpp/include/libarchive")
      def libarchiveIncludeInZip = new File(libarchiveExtractDir, "include")
      if (libarchiveIncludeInZip.exists()) {
        libarchiveIncludeDir.mkdirs()
        copy { from libarchiveIncludeInZip; into libarchiveIncludeDir }
      }
      downloadDir.mkdirs()
      libarchiveVersionFile.text = currentLibarchiveVersion
      println "[libarchive] applied: (3) GITHUB RELEASE — tag ${tag}"
      println "[libarchive]   url: ${url}"
      println "[libarchive]   into jniLibs: <abi>/*.so from zip → ${jniLibsHuman}/"
      println "[libarchive]   into headers: include/** → ${libarchiveIncludeDir} (if present)"
      println "[libarchive]   stamp: ${libarchiveVersionFile.absolutePath} = ${currentLibarchiveVersion}"
    }

    if (sherpaNeedsUpdate && !sherpaUpdatedFromAar[0]) {
      def tagFile = file("${project.projectDir.parent}/third_party/sherpa-onnx-prebuilt/ANDROID_RELEASE_TAG")
      def tag = readReleaseTag(tagFile)
      if (!tag) throw new RuntimeException("Missing or empty third_party/sherpa-onnx-prebuilt/ANDROID_RELEASE_TAG")
      def zipFile = new File(downloadDir, "sherpa-onnx-android.zip")
      def url = "${baseUrl}/${tag}/sherpa-onnx-android.zip"
      project.exec { commandLine 'curl', '-sSL', '-o', zipFile, url; workingDir project.projectDir }
      if (!zipFile.exists() || zipFile.length() == 0) throw new RuntimeException("Download failed or empty: ${url}")
      def sherpaExtractDir = new File(downloadDir, "sherpa-onnx-extract")
      if (sherpaExtractDir.exists()) sherpaExtractDir.deleteDir()
      sherpaExtractDir.mkdirs()
      copy {
        from zipTree(zipFile)
        into sherpaExtractDir
      }
      copy {
        from fileTree(sherpaExtractDir) { include 'arm64-v8a/**', 'armeabi-v7a/**', 'x86/**', 'x86_64/**' }
        into jniLibsDir
      }
      def includeSherpaDir = file("${project.projectDir}/src/main/cpp/include/sherpa-onnx")
      copy {
        from fileTree(sherpaExtractDir) { include 'c-api/**' }
        into includeSherpaDir
      }
      def sherpaJavaJar = new File(sherpaExtractDir, "java/classes.jar")
      if (sherpaJavaJar.exists()) {
        sherpaOnnxClassesDir.mkdirs()
        copy { from sherpaJavaJar; into sherpaOnnxClassesDir }
      }
      downloadDir.mkdirs()
      sherpaVersionFile.text = currentSherpaVersion
      println "[sherpa-onnx] applied: (3) GITHUB RELEASE — tag ${tag}"
      println "[sherpa-onnx]   url: ${url}"
      println "[sherpa-onnx]   into jniLibs: <abi>/*.so from zip → ${jniLibsHuman}/"
      println "[sherpa-onnx]   into headers: c-api/** → ${includeSherpaDir}"
      println "[sherpa-onnx]   classes.jar: ${sherpaJavaJar.exists() ? 'copied to ' + sherpaOnnxClassesDir : 'not in zip'}"
      println "[sherpa-onnx]   stamp: ${sherpaVersionFile.absolutePath} = ${currentSherpaVersion}"
    } else {
      def sherpaClassesJar = file("${project.projectDir.parent}/third_party/sherpa-onnx-prebuilt/android/java/classes.jar")
      if (sherpaClassesJar.exists() && !sherpaOnnxClassesDir.listFiles()?.any { it.name.endsWith('.jar') }) {
        sherpaOnnxClassesDir.mkdirs()
        copy { from sherpaClassesJar; into sherpaOnnxClassesDir }
        println "[sherpa-onnx] supplement: (1) LOCAL third_party — classes.jar only"
        println "[sherpa-onnx]   from: ${sherpaClassesJar.absolutePath}"
        println "[sherpa-onnx]   into: ${sherpaOnnxClassesDir} (sherpa-onnx native libs/headers were not fetched via GitHub this run)"
      }
    }
    println ""
  }
}

project.tasks.register("checkJniLibs") {
  dependsOn project.tasks.named("downloadNativeLibsIfNeeded")
  doLast {
    requiredAbis.each { abi ->
      def dir = file("${project.projectDir}/src/main/jniLibs/${abi}")
      if (!dir.exists()) {
        throw new RuntimeException("Missing native libs for ABI ${abi} in ${dir}. Run a Gradle Android build (downloadNativeLibsIfNeeded), use Maven com.xdcobra.sherpa:{ffmpeg,sherpa-onnx,libarchive}, or ensure ANDROID_RELEASE_TAG GitHub releases exist.")
      }
      if (!sherpaOnnxDisableFfmpeg) {
        requiredFfmpegSoFiles.each { soName ->
          def soFile = new File(dir, soName)
          if (!soFile.exists()) {
            throw new RuntimeException("Missing required FFmpeg library '${soName}' for ABI ${abi}. Run a Gradle Android build so prebuilts download, or ensure Maven com.xdcobra.sherpa:ffmpeg resolves. Or set sherpaOnnxDisableFfmpeg=true in gradle.properties (see docs/disable-ffmpeg.md).")
          }
        }
      }
      requiredSherpaOnnxSoFiles.each { soName ->
        def soFile = new File(dir, soName)
        if (!soFile.exists()) {
          throw new RuntimeException("Missing required sherpa-onnx library '${soName}' for ABI ${abi}. Run a Gradle Android build so prebuilts download, or ensure Maven com.xdcobra.sherpa:sherpa-onnx resolves.")
        }
      }
      if (!sherpaOnnxDisableLibarchive) {
        requiredLibarchiveSoFiles.each { soName ->
          def soFile = new File(dir, soName)
          if (!soFile.exists()) {
            throw new RuntimeException("Missing required libarchive library '${soName}' for ABI ${abi}. Run a Gradle Android build so prebuilts download, or ensure Maven com.xdcobra.sherpa:libarchive resolves. Or set sherpaOnnxDisableLibarchive=true in gradle.properties (see docs/disable-libarchive.md).")
          }
        }
      }
      requiredOnnxruntimeJniSoFiles.each { soName ->
        def soFile = new File(dir, soName)
        if (!soFile.exists()) {
          throw new RuntimeException("Missing onnxruntime JNI bridge '${soName}' for ABI ${abi}. Ensure Maven com.xdcobra.sherpa:onnxruntime is available.")
        }
      }
    }
  }
}

project.afterEvaluate {
  project.tasks.findByName('preBuild')?.dependsOn(project.tasks.findByName('checkJniLibs'))
}

def sherpaLocalJar = file("${project.projectDir.parent}/third_party/sherpa-onnx-prebuilt/android/java/classes.jar")
def sherpaExtractedJar = file("${project.buildDir}/prebuilt-downloads/sherpa-onnx-extract/java/classes.jar")

project.tasks.register("extractSherpaOnnxClasses") {
  outputs.dir sherpaOnnxClassesDir
  inputs.files(project.configurations.sherpaOnnxAar)
  if (sherpaLocalJar.exists()) inputs.file(sherpaLocalJar)
  doLast {
    sherpaOnnxClassesDir.mkdirs()
    file(sherpaOnnxClassesDir).listFiles()?.findAll { it.name.endsWith('.jar') }?.each { it.delete() }
    if (sherpaLocalJar.exists()) {
      copy { from sherpaLocalJar; into sherpaOnnxClassesDir }
      println "[sherpa-onnx] extractSherpaOnnxClasses: (1) LOCAL — ${sherpaLocalJar.absolutePath} → ${sherpaOnnxClassesDir}"
      return
    }
    def aarFiles = project.configurations.sherpaOnnxAar.files
    if (!aarFiles.isEmpty()) {
      def aar = aarFiles.iterator().next()
      copy {
        from zipTree(aar)
        include 'classes.jar'
        into sherpaOnnxClassesDir
      }
      println "[sherpa-onnx] extractSherpaOnnxClasses: (2) MAVEN AAR — ${aar.name} (classes.jar) → ${sherpaOnnxClassesDir}"
      return
    }
    if (sherpaExtractedJar.exists()) {
      copy { from sherpaExtractedJar; into sherpaOnnxClassesDir }
      println "[sherpa-onnx] extractSherpaOnnxClasses: (3) GITHUB — prior extract ${sherpaExtractedJar.absolutePath} → ${sherpaOnnxClassesDir}"
      return
    }
    throw new RuntimeException(
      "Missing sherpa-onnx classes.jar (Kotlin API). Use (1) local build_sherpa_onnx.sh, (2) Maven com.xdcobra.sherpa:sherpa-onnx, or (3) a GitHub release with java/classes.jar.")
  }
}

// Extract classes.jar from the onnxruntime AAR so ai.onnxruntime.* Java classes
// are bundled directly in the SDK. No compileOnly needed; users get it for free.
project.tasks.register("extractOnnxruntimeClasses") {
  outputs.dir onnxruntimeClassesDir
  inputs.files(project.configurations.onnxruntimeAar)
  doLast {
    onnxruntimeClassesDir.mkdirs()
    file(onnxruntimeClassesDir).listFiles()?.findAll { it.name.endsWith('.jar') }?.each { it.delete() }
    def aarFiles = project.configurations.onnxruntimeAar.files
    if (!aarFiles.isEmpty()) {
      def aar = aarFiles.iterator().next()
      copy {
        from zipTree(aar)
        include 'classes.jar'
        into onnxruntimeClassesDir
      }
      def extractedJar = new File(onnxruntimeClassesDir, "classes.jar")
      if (extractedJar.exists()) {
        def renamed = new File(onnxruntimeClassesDir, "onnxruntime-classes.jar")
        extractedJar.renameTo(renamed)
      }
      println "[onnxruntime] extractOnnxruntimeClasses: (2) MAVEN AAR — ${aar.name} (classes.jar → onnxruntime-classes.jar) → ${onnxruntimeClassesDir}"
      return
    }
    throw new RuntimeException(
      "Missing onnxruntime classes.jar. Ensure Maven com.xdcobra.sherpa:onnxruntime is available.")
  }
}
