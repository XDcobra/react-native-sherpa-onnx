// Resolve prebuilt versions from env, ANDROID_RELEASE_TAG files, or defaults.
// Used by dependencies (AAR coordinates) and by prebuilt-download.gradle.
// Returns version string from tag file (e.g. ffmpeg-android-v8.0.1-2 -> 8.0.1-2) or null if not found.
// Trailing -N is our rebuild counter; there is no unsuffixed-tag fallback.
def readVersionFromTagFile(File tagFile, String prefix) {
  if (!tagFile.exists()) return null
  def tag = tagFile.text.split(/\r?\n/).findResult { line ->
    def t = line.replaceAll(/\s*#.*$/, '').trim()
    t ? t : null
  }
  if (tag?.startsWith(prefix)) return tag.replaceFirst(~/^\Q${prefix}\E/, '')
  return null
}

// Module root: parent of android/ (so tag files resolve when SDK is used as dependency, e.g. node_modules/react-native-sherpa-onnx).
def moduleRoot = project.projectDir.parentFile

def sdkVersion = 'unknown'
def packageJson = new File(moduleRoot, 'package.json')
if (packageJson.exists()) {
  def parsed = new groovy.json.JsonSlurper().parse(packageJson)
  if (parsed.version) sdkVersion = parsed.version.toString()
}
project.ext.sdkVersion = sdkVersion
println "[react-native-sherpa-onnx] SDK version: ${sdkVersion}"

// sherpa-onnx: 1. SHERPA_ONNX_VERSION env 2. ANDROID_RELEASE_TAG 3. property 4. default
def sherpaOnnxVersion = System.getenv('SHERPA_ONNX_VERSION')
if (!sherpaOnnxVersion) {
  def v = readVersionFromTagFile(new File(moduleRoot, 'third_party/sherpa-onnx-prebuilt/ANDROID_RELEASE_TAG'), 'sherpa-onnx-android-v')
  sherpaOnnxVersion = v ?: (project.hasProperty('sherpaOnnxVersion') ? project.sherpaOnnxVersion : '1.12.31')
}
project.ext.sherpaOnnxVersion = sherpaOnnxVersion
println "[react-native-sherpa-onnx] sherpa-onnx version (extracted/used): ${sherpaOnnxVersion}"

