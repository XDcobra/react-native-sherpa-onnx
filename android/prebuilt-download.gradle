  for (abi in requiredAbis) {
    def dir = new File(jniLibsDir, abi)
    if (!dir.exists()) return false
    for (soName in requiredFfmpegSoFiles) {
      if (!new File(dir, soName).exists()) return false
    }
  }
  return true
}

