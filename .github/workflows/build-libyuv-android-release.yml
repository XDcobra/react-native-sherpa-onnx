# Build libyuv for Android and publish as GitHub Release and to Maven.
# Release tag is read from third_party/libyuv_prebuilt/ANDROID_RELEASE_TAG.
# AAR is published to GitHub Pages Maven as com.xdcobra.sherpa:libyuv when MAVEN_REPO_PAT is set.
#
# When to run manually (Actions --> Prebuilt - libyuv (Android) Release --> Run workflow):
# 1. After updating third_party/libyuv_prebuilt/ANDROID_RELEASE_TAG or libyuv submodule.
# 2. When you want to publish a new libyuv Android release (zip + AAR, optional Maven).
#
name: Prebuilt - libyuv (Android) Release

on:
  # Temporary: register the workflow off main so `gh workflow run --ref` works.
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-libyuv-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Read release tag
        id: tag
        run: |
          TAG_FILE=third_party/libyuv_prebuilt/ANDROID_RELEASE_TAG
          if [ ! -f "$TAG_FILE" ]; then
            echo "::error::Missing $TAG_FILE (add a line with the release tag, e.g. libyuv-android-v1976-1)"
            exit 1
          fi
          RELEASE_TAG=$(grep -v '^#' "$TAG_FILE" | grep -v '^[[:space:]]*$' | head -1 | tr -d '\r\n')
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::Empty release tag in $TAG_FILE"
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          MAVEN_VERSION=$(echo "$RELEASE_TAG" | sed 's/^libyuv-android-v//')
          echo "maven_version=$MAVEN_VERSION" >> $GITHUB_OUTPUT
          echo "Using release tag: $RELEASE_TAG (Maven version: $MAVEN_VERSION)"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true
          local-cache: false

      - name: Get submodule versions
        id: submodules
        run: |
          echo "libyuv=$(git -C third_party/libyuv rev-parse HEAD 2>/dev/null || echo 'none')" >> "$GITHUB_OUTPUT"

      - name: Cache libyuv prebuilts
        uses: actions/cache@v6
        id: libyuv-cache
        with:
          path: |
            third_party/libyuv_prebuilt/android
          key: libyuv-android-prebuilt-${{ steps.submodules.outputs.libyuv }}-${{ hashFiles('third_party/libyuv_prebuilt/build_libyuv_android.sh', 'third_party/libyuv_prebuilt/CMakeLists.txt') }}

      - name: Build libyuv
        if: steps.libyuv-cache.outputs.cache-hit != 'true'
        run: |
          cd third_party/libyuv_prebuilt
          chmod +x build_libyuv_android.sh
          ./build_libyuv_android.sh
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Package jniLibs layout
        run: |
          LAYOUT=libyuv-android-layout
          rm -rf "$LAYOUT"
          mkdir -p "$LAYOUT"
          ABIS="arm64-v8a armeabi-v7a x86 x86_64"
          for abi in $ABIS; do
            mkdir -p "$LAYOUT/$abi"
            SRC="third_party/libyuv_prebuilt/android/jni/$abi"
            if [ ! -d "$SRC" ]; then
              SRC="third_party/libyuv_prebuilt/android/$abi/lib"
            fi
            if [ -d "$SRC" ]; then
              cp "$SRC"/*.so "$LAYOUT/$abi/" 2>/dev/null || true
            fi
          done
          if [ -d "third_party/libyuv_prebuilt/android/include" ]; then
            mkdir -p "$LAYOUT/include"
            cp -R third_party/libyuv_prebuilt/android/include/* "$LAYOUT/include/"
          fi
          echo "Layout contents:"
          find "$LAYOUT" -type f \( -name '*.so' -o -name '*.h' \) | head -50

      - name: Upload layout as artifact
        uses: actions/upload-artifact@v7
        with:
          name: libyuv-android-layout-${{ steps.tag.outputs.maven_version }}
          path: libyuv-android-layout/
          retention-days: 7

      - name: Create release zip
        run: |
          cd libyuv-android-layout
          zip -r ../libyuv-android.zip .
          cd ..
          ls -la libyuv-android.zip

      - name: Create libyuv AAR
        run: |
          chmod +x third_party/libyuv_prebuilt/create_libyuv_aar.sh
          VER="${{ steps.tag.outputs.maven_version }}"
          third_party/libyuv_prebuilt/create_libyuv_aar.sh libyuv-android-layout "$VER" "libyuv-${VER}.aar"
          ls -la "libyuv-${VER}.aar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: libyuv Android ${{ steps.tag.outputs.release_tag }}
          make_latest: false
          body: |
            ## Archive Structure
            Prebuilt **libyuv** for Android (arm64-v8a, armeabi-v7a, x86, x86_64). Used by VideoBuffer color convert / scale / rotate in `react-native-sherpa-onnx`.
            - **libyuv-android.zip** – Layout: `arm64-v8a/`, `armeabi-v7a/`, `x86/`, `x86_64/` (`libyuv.so`) and `include/` (C headers under `libyuv/`).
            - **libyuv-${{ steps.tag.outputs.maven_version }}.aar** – Android library (native libs + headers). Also on Maven as `com.xdcobra.sherpa:libyuv`.

            ## Maven
            The AAR is published to [GitHub Pages Maven](https://xdcobra.github.io/maven/) as `com.xdcobra.sherpa:libyuv` when `MAVEN_REPO_PAT` is set.

            ```gradle
            repositories {
                maven { url 'https://xdcobra.github.io/maven/' }
            }
            dependencies {
                implementation 'com.xdcobra.sherpa:libyuv:${{ steps.tag.outputs.maven_version }}'
            }
            ```

            Always-on for VideoBuffer. No disable flag.
          files: |
            libyuv-android.zip
            libyuv-${{ steps.tag.outputs.maven_version }}.aar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish libyuv AAR to GitHub Pages Maven (XDcobra/maven)
        if: success()
        env:
          MAVEN_REPO_PAT: ${{ secrets.MAVEN_REPO_PAT }}
          MAVEN_VERSION: ${{ steps.tag.outputs.maven_version }}
          AAR_SRC: libyuv-${{ steps.tag.outputs.maven_version }}.aar
        run: |
          if [ -z "${MAVEN_REPO_PAT}" ]; then
            echo "MAVEN_REPO_PAT not set, skipping Maven publish."
            exit 0
          fi
          chmod +x third_party/libyuv_prebuilt/publish-maven/publish-to-github-pages.sh
          third_party/libyuv_prebuilt/publish-maven/publish-to-github-pages.sh

      - name: Summary
        run: |
          echo "## libyuv Android release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** [${{ steps.tag.outputs.release_tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`libyuv-android.zip\` | Layout: ABIs with libyuv.so and \`include/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`libyuv-${{ steps.tag.outputs.maven_version }}.aar\` | Android library; Maven \`com.xdcobra.sherpa:libyuv\` when MAVEN_REPO_PAT is set |" >> $GITHUB_STEP_SUMMARY
