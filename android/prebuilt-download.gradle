// Prebuilt download and check logic. Applied after android {} and configurations.
// Depends on: sherpaOnnxVersion, ffmpegVersion, libarchiveVersion, lexborVersion, libyuvVersion, libwebpVersion, ortVersion (from prebuilt-versions.gradle)
// and configurations.sherpaOnnxAar, ffmpegAar, libarchiveAar, lexborAar, libyuvAar, libwebpAar, onnxruntimeAar (from build.gradle).
//
// Resolution order per artifact (see docs/PREBUILT_RESOLUTION.md):
//   (1) THIRD_PARTY    — prebuilt files under third_party/<bundle>/android/ (no network)
//   (2) LOCAL_SDK       — reuse files already in android/src/main/jniLibs + cpp/include, stamp OK
//   (3) MAVEN_AAR       — extracted from resolved Gradle AAR configuration
//   (4) GITHUB_RELEASE  — downloaded release ZIP (curl) using ANDROID_RELEASE_TAG + GitHub repo
//   (5) ERROR           — build failure if artifact still missing
// When sherpaOnnxDisableFfmpeg=true (gradle.properties), FFmpeg is not required; see docs/disable-ffmpeg.md.
// When sherpaOnnxDisableLibarchive=true (gradle.properties), libarchive is not required; see docs/disable-libarchive.md.
// When sherpaOnnxEnableLibwebp=false (default), libwebp is not required (ImageBuffer WebP decode/export disabled).

def sherpaOnnxDisableFfmpeg = (project.findProperty("sherpaOnnxDisableFfmpeg") ?: "false").toString().toLowerCase() in ["true", "1"]
def sherpaOnnxDisableLibarchive = (project.findProperty("sherpaOnnxDisableLibarchive") ?: "false").toString().toLowerCase() in ["true", "1"]
// Opt-in (default false). When false, skip all libwebp download/link requirements.
def sherpaOnnxEnableLibwebp = (project.findProperty("sherpaOnnxEnableLibwebp") ?: "false").toString().toLowerCase() in ["true", "1"]
// Opt-in (default false). When false, skip all PDFium download/link requirements.
def sherpaOnnxEnablePdfium = (project.findProperty("sherpaOnnxEnablePdfium") ?: "false").toString().toLowerCase() in ["true", "1"]
// Opt-in (default false). When true, resolve com.xdcobra.sherpa:ffmpeg-vsw and the vsw GitHub zip.
def sherpaOnnxEnableVideoSwDecoders = (project.findProperty("sherpaOnnxEnableVideoSwDecoders") ?: "false").toString().toLowerCase() in ["true", "1"]

