/** Resolve libwebp .so dir for one ABI: jni/<abi>/ (release layout) or <abi>/lib/ (build script output). */
def libwebpThirdPartySoDirForAbi = { File webpBase, String abi ->
  def jniDir = new File(webpBase, "jni/${abi}")
  if (jniDir.exists()) return jniDir
  def abiLibDir = new File(webpBase, "${abi}/lib")
  if (abiLibDir.exists()) return abiLibDir
  return null
}

