# Speaker embedding validation unit tests (ValidateSpeakerEmbeddingPaths, DetectSpeakerEmbeddingModelFromFileList edge cases).

name: Test – Speaker embedding validation

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-speaker-embedding-validate
  cancel-in-progress: true

jobs:
  speaker-embedding-validate:
    name: Speaker embedding validation (C++)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libgtest-dev

      - name: Configure and build
        run: |
          mkdir -p test/cpp/build && cd test/cpp/build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Run speaker embedding validation tests
        working-directory: ${{ github.workspace }}
        run: |
          ./test/cpp/build/model_detect_test \
            --gtest_filter=ModelDetectValidation.ValidateSpeakerEmbedding*:ModelDetectValidation.SpeakerEmbedding*
