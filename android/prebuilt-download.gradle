/** Check whether a base dir has all required .so for all ABIs under <baseDir>/jni/<abi>/. */
def hasAllLibsUnder = { File baseDir, List<String> requiredSo ->
  for (abi in requiredAbis) {
    def dir = new File(baseDir, "jni/${abi}")
    if (!dir.exists()) return false
    for (soName in requiredSo) {
      if (!new File(dir, soName).exists()) return false
    }
  }
  return true
}

/** Resolve FFmpeg .so dir for one ABI: jni/<abi>/ (release layout) or <abi>/lib/ (build_ffmpeg.sh output). */
def ffmpegThirdPartySoDirForAbi = { File ffmpegBase, String abi ->
  def jniDir = new File(ffmpegBase, "jni/${abi}")
  if (jniDir.exists()) return jniDir
  def abiLibDir = new File(ffmpegBase, "${abi}/lib")
  if (abiLibDir.exists()) return abiLibDir
  return null
}

/** THIRD_PARTY FFmpeg: jni/<abi>/ or <abi>/lib/; libshine may live under shine_prebuilt/android/<abi>/lib/. */
def hasFfmpegThirdPartyLibs = {
  for (abi in requiredAbis) {
    def soDir = ffmpegThirdPartySoDirForAbi(thirdPartyFfmpegDir, abi)
    if (!soDir) return false
    for (soName in requiredFfmpegSoFiles) {
      if (new File(soDir, soName).exists()) continue
      if (soName == 'libshine.so') {
        def shineDir = ffmpegThirdPartySoDirForAbi(thirdPartyShineDir, abi)
        if (shineDir != null && new File(shineDir, soName).exists()) continue
      }
      return false
    }
  }
  return true
}

def copyFfmpegThirdPartyLibsToJniLibs = {
  requiredAbis.each { abi ->
    def dest = new File(jniLibsDir, abi)
    dest.mkdirs()
    def soDir = ffmpegThirdPartySoDirForAbi(thirdPartyFfmpegDir, abi)
    if (soDir) {
      copy { from soDir; into dest; include '*.so' }
    }
    def shineSo = new File(dest, 'libshine.so')
    if (!shineSo.exists()) {
      def shineDir = ffmpegThirdPartySoDirForAbi(thirdPartyShineDir, abi)
      if (shineDir != null) {
        copy { from shineDir; into dest; include 'libshine.so' }
      }
    }
  }
}

def getGitHubRepo = {
  try {
    def proc = ['git', 'remote', 'get-url', 'origin'].execute(null, project.rootDir)
    proc.waitFor()
    if (proc.exitValue() != 0) return null
    def url = proc.text.trim()
    def m = (url =~ /github\.com[:\/]([^\/]+\/[^\/\s]+?)(\.git)?$/)
    return m ? m[0][1] : null
  } catch (Exception e) { return null }
}

def readReleaseTag = { File tagFile ->
  if (!tagFile.exists()) return null
  return tagFile.text.split(/\r?\n/).findResult { line ->
    def t = line.replaceAll(/\s*#.*$/, '').trim()
    t ? t : null
  }
}

/** Which .so files are missing under jniLibs for one ABI (for diagnostics). */
def listMissingSoInAbi = { File abiDir, List<String> required ->
  if (!abiDir.exists()) return required
  required.findAll { soName -> !new File(abiDir, soName).exists() }
}

/** First ABI dir that is incomplete for the given required list, or null if all OK. */
def firstAbiWithMissingLibs = { List<String> required ->
  for (abi in requiredAbis) {
    def abiDir = new File(jniLibsDir, abi)
    def missing = listMissingSoInAbi(abiDir, required)
    if (!missing.isEmpty()) return [abi, missing]
  }
  return null
}

/** `[package]  part  SOURCE  detail` — fixed columns, no dot-padding. */
def logPrebuilt = { String pkg, String part, String source, String detail = "" ->
  println String.format("%-14s %-8s %-14s%s", "[${pkg}]", part, source, detail ? " ${detail}" : "")
}

project.tasks.register("downloadNativeLibsIfNeeded") {
  doLast {
    def downloadDir = file("${project.buildDir}/prebuilt-downloads")

    def currentSherpaVersion = project.ext.sherpaOnnxVersion
    def sherpaVersionFile = new File(downloadDir, "sherpa-onnx-version.txt")
    def storedSherpaVersion = (sherpaVersionFile.exists() ? sherpaVersionFile.text.trim() : null)
    def sherpaLibsOk = hasAllSherpaLibs()
    def sherpaHdrsOk = hasSherpaHeaders()
    def sherpaNeedsUpdate = !sherpaLibsOk || !sherpaHdrsOk || storedSherpaVersion == null || storedSherpaVersion != currentSherpaVersion

    def currentFfmpegVersion = project.ext.ffmpegVersion
    // Stamp includes the variant so flipping sherpaOnnxEnableVideoSwDecoders re-resolves.
    def currentFfmpegStamp = sherpaOnnxEnableVideoSwDecoders ? "${currentFfmpegVersion}-vsw" : currentFfmpegVersion
    def ffmpegVersionFile = new File(downloadDir, "ffmpeg-version.txt")
    def storedFfmpegVersion = (ffmpegVersionFile.exists() ? ffmpegVersionFile.text.trim() : null)
    def ffmpegLibsOk = hasAllFfmpegLibs()
    def ffmpegHdrsOk = hasFfmpegHeaders()
    def ffmpegNeedsUpdate = !ffmpegLibsOk || !ffmpegHdrsOk || storedFfmpegVersion == null || storedFfmpegVersion != currentFfmpegStamp

    def currentLibarchiveVersion = project.ext.libarchiveVersion
    def libarchiveVersionFile = new File(downloadDir, "libarchive-version.txt")
    def storedLibarchiveVersion = (libarchiveVersionFile.exists() ? libarchiveVersionFile.text.trim() : null)
    def libarchiveLibsOk = hasAllLibarchiveLibs()
    def libarchiveHdrsOk = hasLibarchiveHeaders()
    def libarchiveNeedsUpdate = !libarchiveLibsOk || !libarchiveHdrsOk || storedLibarchiveVersion == null || storedLibarchiveVersion != currentLibarchiveVersion

    def currentLexborVersion = project.ext.lexborVersion
    def lexborVersionFile = new File(downloadDir, "lexbor-version.txt")
    def storedLexborVersion = (lexborVersionFile.exists() ? lexborVersionFile.text.trim() : null)
    def lexborLibsOk = hasAllLexborLibs()
    def lexborHdrsOk = hasLexborHeaders()
    def lexborNeedsUpdate = !lexborLibsOk || !lexborHdrsOk || storedLexborVersion == null || storedLexborVersion != currentLexborVersion

    def currentLibyuvVersion = project.ext.libyuvVersion
    def libyuvVersionFile = new File(downloadDir, "libyuv-version.txt")
    def storedLibyuvVersion = (libyuvVersionFile.exists() ? libyuvVersionFile.text.trim() : null)
    def libyuvLibsOk = hasAllLibyuvLibs()
    def libyuvHdrsOk = hasLibyuvHeaders()
    def libyuvNeedsUpdate = !libyuvLibsOk || !libyuvHdrsOk || storedLibyuvVersion == null || storedLibyuvVersion != currentLibyuvVersion

    def currentLibwebpVersion = project.ext.libwebpVersion
    def libwebpVersionFile = new File(downloadDir, "libwebp-version.txt")
    def storedLibwebpVersion = (libwebpVersionFile.exists() ? libwebpVersionFile.text.trim() : null)
    def libwebpLibsOk = hasAllLibwebpLibs()
    def libwebpHdrsOk = hasLibwebpHeaders()
    def libwebpNeedsUpdate = !libwebpLibsOk || !libwebpHdrsOk || storedLibwebpVersion == null || storedLibwebpVersion != currentLibwebpVersion

    println "[prebuilt] THIRD_PARTY → LOCAL_SDK → MAVEN_AAR → GITHUB_RELEASE"

    def sherpaResolved = false
    def ffmpegResolved = false
    def libarchiveResolved = false
    def lexborResolved = false
    def libyuvResolved = false
    def libwebpResolved = false

    // =====================================================================
    // sherpa-onnx: JNI (.so) + C headers
    // =====================================================================
    if (sherpaNeedsUpdate) {
      // Stage 1: THIRD_PARTY
      def tpJni = hasAllLibsUnder(thirdPartySherpaDir, requiredSherpaOnnxSoFiles)
      def tpHdr = new File(thirdPartySherpaDir, "include/sherpa-onnx/c-api/c-api.h").exists()
      if (tpJni && tpHdr) {
        requiredAbis.each { abi ->
          copy { from new File(thirdPartySherpaDir, "jni/${abi}"); into new File(jniLibsDir, abi) }
        }
        def includeSherpaDir = file("${project.projectDir}/src/main/cpp/include/sherpa-onnx")
        includeSherpaDir.mkdirs()
        copy { from new File(thirdPartySherpaDir, "include/sherpa-onnx"); into includeSherpaDir }
        downloadDir.mkdirs()
        sherpaVersionFile.text = currentSherpaVersion
        sherpaResolved = true
        logPrebuilt("sherpa-onnx", "native", "THIRD_PARTY", currentSherpaVersion)
      }

      // Stage 3: MAVEN_AAR
      if (!sherpaResolved) {
        try {
          def aarFiles = project.configurations.sherpaOnnxAar.files
          if (!aarFiles.isEmpty()) {
            downloadDir.mkdirs()
            def aar = aarFiles.iterator().next()
            def aarExtractDir = new File(downloadDir, "sherpa-onnx-aar-extract")
            if (aarExtractDir.exists()) aarExtractDir.deleteDir()
            aarExtractDir.mkdirs()
            copy { from zipTree(aar); into aarExtractDir }
            requiredAbis.each { abi ->
              def aarJniDir = new File(aarExtractDir, "jni/${abi}")
              if (aarJniDir.exists()) {
                copy { from aarJniDir; into new File(jniLibsDir, abi) }
              }
            }
            def includeSherpaDir = file("${project.projectDir}/src/main/cpp/include/sherpa-onnx")
            def aarCapiDir = new File(aarExtractDir, "c-api")
            def copiedHeaders = false
            if (aarCapiDir.exists()) {
              includeSherpaDir.mkdirs()
              copy { from fileTree(aarExtractDir) { include 'c-api/**' }; into includeSherpaDir }
              copiedHeaders = true
            }
            downloadDir.mkdirs()
            sherpaVersionFile.text = currentSherpaVersion
            sherpaResolved = true
            logPrebuilt("sherpa-onnx", "native", "MAVEN_AAR", aar.name)
            if (!copiedHeaders) {
              logPrebuilt("sherpa-onnx", "headers", "unchanged", "no c-api/ in AAR")
            }
          } else {
            println "[sherpa-onnx] MAVEN_AAR: sherpaOnnxAar empty --> trying GITHUB_RELEASE"
          }
        } catch (Exception e) {
          println "[sherpa-onnx] MAVEN_AAR failed: ${e.message} --> trying GITHUB_RELEASE"
        }
      }
    } else {
      sherpaResolved = true
      logPrebuilt("sherpa-onnx", "native", "LOCAL_SDK", currentSherpaVersion)
    }

    // =====================================================================
    // FFmpeg: JNI (.so) + C headers
    // =====================================================================
    if (sherpaOnnxDisableFfmpeg) {
      ffmpegResolved = true
      logPrebuilt("FFmpeg", "skipped", "disabled", "sherpaOnnxDisableFfmpeg=true")
    } else if (ffmpegNeedsUpdate) {
      // Stage 1: THIRD_PARTY (jni/<abi>/ or build_ffmpeg.sh <abi>/lib/; libshine from shine_prebuilt if needed)
      def tpJni = hasFfmpegThirdPartyLibs()
      def tpHdr = new File(thirdPartyFfmpegDir, "include/libavcodec/avcodec.h").exists()
      if (tpJni && tpHdr) {
        copyFfmpegThirdPartyLibsToJniLibs()
        def ffmpegIncludeDir = file("${project.projectDir}/src/main/cpp/include/ffmpeg")
        ffmpegIncludeDir.mkdirs()
        copy { from new File(thirdPartyFfmpegDir, "include"); into ffmpegIncludeDir }
        downloadDir.mkdirs()
        ffmpegVersionFile.text = currentFfmpegStamp
        ffmpegResolved = true
        logPrebuilt("FFmpeg", "native", "THIRD_PARTY", currentFfmpegStamp)
      }

      // Stage 3: MAVEN_AAR
      if (!ffmpegResolved) {
        try {
          def aarFiles = project.configurations.ffmpegAar.files
          if (!aarFiles.isEmpty()) {
            downloadDir.mkdirs()
            def aar = aarFiles.iterator().next()
            def aarExtractDir = new File(downloadDir, "ffmpeg-aar-extract")
            if (aarExtractDir.exists()) aarExtractDir.deleteDir()
            aarExtractDir.mkdirs()
            copy { from zipTree(aar); into aarExtractDir }
            requiredAbis.each { abi ->
              def aarJniDir = new File(aarExtractDir, "jni/${abi}")
              if (aarJniDir.exists()) {
                copy { from aarJniDir; into new File(jniLibsDir, abi) }
              }
            }
            def ffmpegIncludeDir = file("${project.projectDir}/src/main/cpp/include/ffmpeg")
            def aarIncludeDir = new File(aarExtractDir, "include")
            def copiedHdr = false
            if (aarIncludeDir.exists()) {
              ffmpegIncludeDir.mkdirs()
              copy { from aarIncludeDir; into ffmpegIncludeDir }
              copiedHdr = true
            }
            downloadDir.mkdirs()
            ffmpegVersionFile.text = currentFfmpegStamp
            ffmpegResolved = true
            logPrebuilt("FFmpeg", "native", "MAVEN_AAR", aar.name)
            if (!copiedHdr) {
              logPrebuilt("FFmpeg", "headers", "unchanged", "no include/ in AAR")
            }
          } else {
            println "[FFmpeg] MAVEN_AAR: ffmpegAar empty --> trying GITHUB_RELEASE"
          }
        } catch (Exception e) {
          println "[FFmpeg] MAVEN_AAR failed: ${e.message} --> trying GITHUB_RELEASE"
        }
      }
    } else {
      ffmpegResolved = true
      logPrebuilt("FFmpeg", "native", "LOCAL_SDK", currentFfmpegStamp)
    }

    // =====================================================================
    // libarchive: JNI (.so) + C headers
    // =====================================================================
    if (sherpaOnnxDisableLibarchive) {
      libarchiveResolved = true
      logPrebuilt("libarchive", "skipped", "disabled", "sherpaOnnxDisableLibarchive=true")
    } else if (libarchiveNeedsUpdate) {
      // Stage 1: THIRD_PARTY
      def tpJni = hasAllLibsUnder(thirdPartyLibarchiveDir, requiredLibarchiveSoFiles)
      def tpHdr = new File(thirdPartyLibarchiveDir, "include/archive.h").exists()
      if (tpJni && tpHdr) {
        requiredAbis.each { abi ->
          copy { from new File(thirdPartyLibarchiveDir, "jni/${abi}"); into new File(jniLibsDir, abi) }
        }
        def libarchiveIncludeDir = file("${project.projectDir}/src/main/cpp/include/libarchive")
        libarchiveIncludeDir.mkdirs()
        copy { from new File(thirdPartyLibarchiveDir, "include"); into libarchiveIncludeDir }
        downloadDir.mkdirs()
        libarchiveVersionFile.text = currentLibarchiveVersion
        libarchiveResolved = true
        logPrebuilt("libarchive", "native", "THIRD_PARTY", currentLibarchiveVersion)
      }

      // Stage 3: MAVEN_AAR
      if (!libarchiveResolved) {
        try {
          def aarFiles = project.configurations.libarchiveAar.files
          if (!aarFiles.isEmpty()) {
            downloadDir.mkdirs()
            def aar = aarFiles.iterator().next()
            def aarExtractDir = new File(downloadDir, "libarchive-aar-extract")
            if (aarExtractDir.exists()) aarExtractDir.deleteDir()
            aarExtractDir.mkdirs()
            copy { from zipTree(aar); into aarExtractDir }
            requiredAbis.each { abi ->
              def aarJniDir = new File(aarExtractDir, "jni/${abi}")
              if (aarJniDir.exists()) {
                copy { from aarJniDir; into new File(jniLibsDir, abi) }
              }
            }
            def libarchiveIncludeDir = file("${project.projectDir}/src/main/cpp/include/libarchive")
            def aarIncludeDir = new File(aarExtractDir, "include")
            def copiedHdr = false
            if (aarIncludeDir.exists()) {
              libarchiveIncludeDir.mkdirs()
              copy { from aarIncludeDir; into libarchiveIncludeDir }
              copiedHdr = true
            }
            downloadDir.mkdirs()
            libarchiveVersionFile.text = currentLibarchiveVersion
            libarchiveResolved = true
            logPrebuilt("libarchive", "native", "MAVEN_AAR", aar.name)
            if (!copiedHdr) {
              logPrebuilt("libarchive", "headers", "unchanged", "no include/ in AAR")
            }
          } else {
            println "[libarchive] MAVEN_AAR: libarchiveAar empty --> trying GITHUB_RELEASE"
          }
        } catch (Exception e) {
          println "[libarchive] MAVEN_AAR failed: ${e.message} --> trying GITHUB_RELEASE"
        }
      }
    } else {
      libarchiveResolved = true
      logPrebuilt("libarchive", "native", "LOCAL_SDK", currentLibarchiveVersion)
    }

    // =====================================================================
    // lexbor: JNI (.so) + C headers (document EPUB HTML)
    // =====================================================================
    if (lexborNeedsUpdate) {
      def tpJni = hasAllLibsUnder(thirdPartyLexborDir, requiredLexborSoFiles)
      def tpHdr = new File(thirdPartyLexborDir, "include/lexbor/html/parser.h").exists()
      if (tpJni && tpHdr) {
        requiredAbis.each { abi ->
          def jniSrc = new File(thirdPartyLexborDir, "jni/${abi}")
          if (!jniSrc.exists()) {
            jniSrc = new File(thirdPartyLexborDir, "${abi}/lib")
          }
          if (jniSrc.exists()) {
            copy { from jniSrc; into new File(jniLibsDir, abi) }
          }
        }
        def lexborIncludeDir = file("${project.projectDir}/src/main/cpp/include/lexbor")
        lexborIncludeDir.mkdirs()
        copy { from new File(thirdPartyLexborDir, "include/lexbor"); into lexborIncludeDir }
        downloadDir.mkdirs()
        lexborVersionFile.text = currentLexborVersion
        lexborResolved = true
        logPrebuilt("lexbor", "native", "THIRD_PARTY", currentLexborVersion)
      }

      if (!lexborResolved) {
        try {
          def aarFiles = project.configurations.lexborAar.files
          if (!aarFiles.isEmpty()) {
            downloadDir.mkdirs()
            def aar = aarFiles.iterator().next()
            def aarExtractDir = new File(downloadDir, "lexbor-aar-extract")
            if (aarExtractDir.exists()) aarExtractDir.deleteDir()
            aarExtractDir.mkdirs()
            copy { from zipTree(aar); into aarExtractDir }
            requiredAbis.each { abi ->
              def aarJniDir = new File(aarExtractDir, "jni/${abi}")
              if (aarJniDir.exists()) {
                copy { from aarJniDir; into new File(jniLibsDir, abi) }
              }
            }
            def lexborIncludeDir = file("${project.projectDir}/src/main/cpp/include/lexbor")
            def aarIncludeDir = new File(aarExtractDir, "include/lexbor")
            if (!aarIncludeDir.exists()) {
              aarIncludeDir = new File(aarExtractDir, "include")
            }
            def copiedHdr = false
            if (aarIncludeDir.exists()) {
              lexborIncludeDir.mkdirs()
              copy { from aarIncludeDir; into lexborIncludeDir }
              copiedHdr = true
            }
            downloadDir.mkdirs()
            lexborVersionFile.text = currentLexborVersion
            lexborResolved = true
            logPrebuilt("lexbor", "native", "MAVEN_AAR", aar.name)
            if (!copiedHdr) {
              logPrebuilt("lexbor", "headers", "unchanged", "no include/ in AAR")
            }
          } else {
            println "[lexbor] MAVEN_AAR: lexborAar empty --> trying GITHUB_RELEASE"
          }
        } catch (Exception e) {
          println "[lexbor] MAVEN_AAR failed: ${e.message} --> trying GITHUB_RELEASE"
        }
      }
    } else {
      lexborResolved = true
      logPrebuilt("lexbor", "native", "LOCAL_SDK", currentLexborVersion)
    }

    // =====================================================================
    // libyuv: JNI (.so) + C headers (VideoBuffer convert / scale / rotate)
    // =====================================================================
    if (libyuvNeedsUpdate) {
      def tpJni = hasAllLibsUnder(thirdPartyLibyuvDir, requiredLibyuvSoFiles)
      def tpHdr = new File(thirdPartyLibyuvDir, "include/libyuv/convert.h").exists()
      if (tpJni && tpHdr) {
        requiredAbis.each { abi ->
          def jniSrc = new File(thirdPartyLibyuvDir, "jni/${abi}")
          if (!jniSrc.exists()) {
            jniSrc = new File(thirdPartyLibyuvDir, "${abi}/lib")
          }
          if (jniSrc.exists()) {
            copy { from jniSrc; into new File(jniLibsDir, abi) }
          }
        }
        def libyuvIncludeDir = file("${project.projectDir}/src/main/cpp/include/libyuv")
        libyuvIncludeDir.mkdirs()
        copy { from new File(thirdPartyLibyuvDir, "include/libyuv"); into libyuvIncludeDir }
        def libyuvH = new File(thirdPartyLibyuvDir, "include/libyuv.h")
        if (libyuvH.exists()) {
          copy { from libyuvH; into file("${project.projectDir}/src/main/cpp/include") }
        }
        downloadDir.mkdirs()
        libyuvVersionFile.text = currentLibyuvVersion
        libyuvResolved = true
        logPrebuilt("libyuv", "native", "THIRD_PARTY", currentLibyuvVersion)
      }

      if (!libyuvResolved) {
        try {
          def aarFiles = project.configurations.libyuvAar.files
          if (!aarFiles.isEmpty()) {
            downloadDir.mkdirs()
            def aar = aarFiles.iterator().next()
            def aarExtractDir = new File(downloadDir, "libyuv-aar-extract")
            if (aarExtractDir.exists()) aarExtractDir.deleteDir()
            aarExtractDir.mkdirs()
            copy { from zipTree(aar); into aarExtractDir }
            requiredAbis.each { abi ->
              def aarJniDir = new File(aarExtractDir, "jni/${abi}")
              if (aarJniDir.exists()) {
                copy { from aarJniDir; into new File(jniLibsDir, abi) }
              }
            }
            def libyuvIncludeDir = file("${project.projectDir}/src/main/cpp/include/libyuv")
            def aarIncludeDir = new File(aarExtractDir, "include/libyuv")
            def copiedHdr = false
            if (aarIncludeDir.exists()) {
              libyuvIncludeDir.mkdirs()
              copy { from aarIncludeDir; into libyuvIncludeDir }
              copiedHdr = true
            }
            def aarYuvH = new File(aarExtractDir, "include/libyuv.h")
            if (aarYuvH.exists()) {
              copy { from aarYuvH; into file("${project.projectDir}/src/main/cpp/include") }
              copiedHdr = true
            }
            downloadDir.mkdirs()
            libyuvVersionFile.text = currentLibyuvVersion
            libyuvResolved = true
            logPrebuilt("libyuv", "native", "MAVEN_AAR", aar.name)
            if (!copiedHdr) {
              logPrebuilt("libyuv", "headers", "unchanged", "no include/ in AAR")
            }
          } else {
            println "[libyuv] MAVEN_AAR: libyuvAar empty --> trying GITHUB_RELEASE"
          }
        } catch (Exception e) {
          println "[libyuv] MAVEN_AAR failed: ${e.message} --> trying GITHUB_RELEASE"
        }
      }
    } else {
      libyuvResolved = true
      logPrebuilt("libyuv", "native", "LOCAL_SDK", currentLibyuvVersion)
    }

    // =====================================================================
    // libwebp: JNI (.so) + C headers (ImageBuffer WebP decode)
    // =====================================================================
    if (!sherpaOnnxEnableLibwebp) {
      libwebpResolved = true
      logPrebuilt("libwebp", "skipped", "disabled", "sherpaOnnxEnableLibwebp=false (default)")
    } else if (libwebpNeedsUpdate) {
      // Stage 1: THIRD_PARTY (jni/<abi>/ or <abi>/lib/)
      def tpHdr = new File(thirdPartyLibwebpDir, "include/webp/decode.h").exists()
      if (hasLibwebpThirdPartyLibs() && tpHdr) {
        requiredAbis.each { abi ->
          def soDir = libwebpThirdPartySoDirForAbi(thirdPartyLibwebpDir, abi)
          if (soDir) {
            copy { from soDir; into new File(jniLibsDir, abi); include '*.so' }
          }
        }
        def libwebpIncludeDir = file("${project.projectDir}/src/main/cpp/include/webp")
        libwebpIncludeDir.mkdirs()
        copy { from new File(thirdPartyLibwebpDir, "include"); into libwebpIncludeDir }
        downloadDir.mkdirs()
        libwebpVersionFile.text = currentLibwebpVersion
        libwebpResolved = true
        logPrebuilt("libwebp", "native", "THIRD_PARTY", currentLibwebpVersion)
      }

      // Stage 3: MAVEN_AAR
      if (!libwebpResolved) {
        try {
          def aarFiles = project.configurations.libwebpAar.files
          if (!aarFiles.isEmpty()) {
            downloadDir.mkdirs()
            def aar = aarFiles.iterator().next()
            def aarExtractDir = new File(downloadDir, "libwebp-aar-extract")
            if (aarExtractDir.exists()) aarExtractDir.deleteDir()
            aarExtractDir.mkdirs()
            copy { from zipTree(aar); into aarExtractDir }
            requiredAbis.each { abi ->
              def aarJniDir = new File(aarExtractDir, "jni/${abi}")
              if (aarJniDir.exists()) {
                copy { from aarJniDir; into new File(jniLibsDir, abi) }
              }
            }
            def libwebpIncludeDir = file("${project.projectDir}/src/main/cpp/include/webp")
            def aarIncludeDir = new File(aarExtractDir, "include")
            def copiedHdr = false
            if (aarIncludeDir.exists()) {
              libwebpIncludeDir.mkdirs()
              copy { from aarIncludeDir; into libwebpIncludeDir }
              copiedHdr = true
            }
            downloadDir.mkdirs()
            libwebpVersionFile.text = currentLibwebpVersion
            libwebpResolved = true
            logPrebuilt("libwebp", "native", "MAVEN_AAR", aar.name)
            if (!copiedHdr) {
              logPrebuilt("libwebp", "headers", "unchanged", "no include/ in AAR")
            }
          } else {
            println "[libwebp] MAVEN_AAR: libwebpAar empty --> trying GITHUB_RELEASE"
          }
        } catch (Exception e) {
          println "[libwebp] MAVEN_AAR failed: ${e.message} --> trying GITHUB_RELEASE"
        }
      }
    } else {
      libwebpResolved = true
      logPrebuilt("libwebp", "native", "LOCAL_SDK", currentLibwebpVersion)
    }

    // =====================================================================
    // pdfium: JNI (.so) + C headers (PDF text-layer extract) — opt-in only
    // =====================================================================
    def pdfiumResolved = !sherpaOnnxEnablePdfium
    if (sherpaOnnxEnablePdfium) {
      def currentPdfiumVersion = project.ext.pdfiumVersion
      def pdfiumVersionFile = new File(downloadDir, "pdfium-version.txt")
      def storedPdfiumVersion = (pdfiumVersionFile.exists() ? pdfiumVersionFile.text.trim() : null)
      def pdfiumNeedsUpdate = !hasAllPdfiumLibs() || !hasPdfiumHeaders() ||
          storedPdfiumVersion == null || storedPdfiumVersion != currentPdfiumVersion

      if (pdfiumNeedsUpdate) {
        def tpHdr = new File(thirdPartyPdfiumDir, "include/fpdfview.h").exists()
        if (hasPdfiumThirdPartyLibs() && tpHdr) {
          requiredAbis.each { abi ->
            def soDir = pdfiumThirdPartySoDirForAbi(thirdPartyPdfiumDir, abi)
            if (soDir) {
              copy { from soDir; into new File(jniLibsDir, abi); include '*.so' }
            }
          }
          def pdfiumIncludeDir = file("${project.projectDir}/src/main/cpp/include/pdfium")
          pdfiumIncludeDir.mkdirs()
          copy { from new File(thirdPartyPdfiumDir, "include"); into pdfiumIncludeDir }
          downloadDir.mkdirs()
          pdfiumVersionFile.text = currentPdfiumVersion
          pdfiumResolved = true
          logPrebuilt("pdfium", "native", "THIRD_PARTY", currentPdfiumVersion)
        }

        if (!pdfiumResolved) {
          try {
            def aarFiles = project.configurations.pdfiumAar.files
            if (aarFiles && !aarFiles.isEmpty()) {
              def aar = aarFiles.iterator().next()
              def extractDir = new File(downloadDir, "pdfium-aar-extract")
              if (extractDir.exists()) extractDir.deleteDir()
              extractDir.mkdirs()
              copy { from zipTree(aar); into extractDir }
              requiredAbis.each { abi ->
                def jni = new File(extractDir, "jni/${abi}")
                if (jni.exists()) {
                  copy { from jni; into new File(jniLibsDir, abi); include '*.so' }
                }
              }
              def hdrSrc = new File(extractDir, "include")
              if (hdrSrc.exists()) {
                def pdfiumIncludeDir = file("${project.projectDir}/src/main/cpp/include/pdfium")
                pdfiumIncludeDir.mkdirs()
                copy { from hdrSrc; into pdfiumIncludeDir }
              }
              downloadDir.mkdirs()
              pdfiumVersionFile.text = currentPdfiumVersion
              pdfiumResolved = true
              logPrebuilt("pdfium", "native", "MAVEN_AAR", currentPdfiumVersion)
            }
          } catch (Exception e) {
            println "[pdfium] MAVEN_AAR failed: ${e.message} --> trying GITHUB_RELEASE"
          }
        }

        // GITHUB_RELEASE deferred to shared download section below (needs baseUrl).
      } else {
        pdfiumResolved = true
        logPrebuilt("pdfium", "native", "LOCAL_SDK", currentPdfiumVersion)
      }
    } else {
      logPrebuilt("pdfium", "skipped", "disabled", "sherpaOnnxEnablePdfium=false (default)")
    }

    // =====================================================================
    // onnxruntime: libonnxruntime.so + libonnxruntime4j_jni.so (same ORT build)
    //
    // Java OrtEnvironment loads libonnxruntime4j_jni.so, which dlopen's libonnxruntime.so.
    // Sherpa-onnx AAR does not ship libonnxruntime.so; both come from the onnxruntime AAR
    // or a full third_party/onnxruntime_prebuilt/android bundle.
    //
    // C API headers (onnxruntime_c_api.h) for native CTC alignment: copy from AAR
    // headers/onnxruntime or include/onnxruntime (and per-ABI <abi>/headers/...) into
    // src/main/cpp/include/onnxruntime so CMake can use them without third_party/onnxruntime.
    //
    // LOCAL_SDK skip requires stamp + matched .so pair + headers. Skipping on files
    // alone would keep a stale ORT (e.g. 1.27 vs 1.28) and break sherpa-onnx-jni
    // (OrtGetApiBase versioned symbols).
    // =====================================================================
    def currentOrtVersion = project.ext.ortVersion
    def ortVersionFile = new File(downloadDir, "onnxruntime-version.txt")
    def storedOrtVersion = (ortVersionFile.exists() ? ortVersionFile.text.trim() : null)
    def ortNeedsUpdate = !hasAllOnnxruntimeBundleLibs() || !hasOnnxruntimeHeaders() ||
        storedOrtVersion == null || storedOrtVersion != currentOrtVersion

    def ortOnnxHeadersDest = file("${project.projectDir}/src/main/cpp/include/onnxruntime")
    def copyOrtHeadersFromOnnxruntimeSubdir = { File onnxruntimeDir, String source, String detail ->
      if (onnxruntimeDir == null || !onnxruntimeDir.isDirectory()) return false
      def marker = new File(onnxruntimeDir, "core/session/onnxruntime_c_api.h")
      if (!marker.exists()) return false
      project.delete(ortOnnxHeadersDest)
      ortOnnxHeadersDest.mkdirs()
      copy { from onnxruntimeDir; into ortOnnxHeadersDest }
      logPrebuilt("onnxruntime", "headers", source, detail)
      return true
    }
    def tryOrtHeadersFromRoot = { File root, String source ->
      if (root == null || !root.exists()) return false
      if (copyOrtHeadersFromOnnxruntimeSubdir(new File(root, "headers/onnxruntime"), source, "headers/onnxruntime")) return true
      if (copyOrtHeadersFromOnnxruntimeSubdir(new File(root, "include/onnxruntime"), source, "include/onnxruntime")) return true
      return false
    }
    def copyOrtHeadersBestEffort = { File root, String source ->
      if (tryOrtHeadersFromRoot(root, source)) return true
      for (abi in requiredAbis) {
        if (tryOrtHeadersFromRoot(new File(root, abi), source)) return true
      }
      return false
    }

    def ortMatchedPairCopied = false
    if (!ortNeedsUpdate) {
      logPrebuilt("onnxruntime", "native", "LOCAL_SDK", currentOrtVersion)
    } else if (hasAllLibsUnder(thirdPartyOrtDir, requiredOnnxruntimeBundleSoFiles)) {
      requiredAbis.each { abi ->
        copy {
          from new File(thirdPartyOrtDir, "jni/${abi}")
          include 'libonnxruntime4j_jni.so', 'libonnxruntime.so'
          into new File(jniLibsDir, abi)
        }
      }
      ortMatchedPairCopied = true
      logPrebuilt("onnxruntime", "native", "THIRD_PARTY", currentOrtVersion)
      copyOrtHeadersBestEffort(thirdPartyOrtDir, "THIRD_PARTY")
      downloadDir.mkdirs()
      ortVersionFile.text = currentOrtVersion
    }
    if (ortNeedsUpdate && !ortMatchedPairCopied) {
      try {
        def aarFiles = project.configurations.onnxruntimeAar.files
        if (!aarFiles.isEmpty()) {
          downloadDir.mkdirs()
          def aar = aarFiles.iterator().next()
          def aarExtractDir = new File(downloadDir, "onnxruntime-aar-extract")
          if (aarExtractDir.exists()) aarExtractDir.deleteDir()
          aarExtractDir.mkdirs()
          copy { from zipTree(aar); into aarExtractDir }
          requiredAbis.each { abi ->
            def aarJniDir = new File(aarExtractDir, "jni/${abi}")
            if (aarJniDir.exists()) {
              copy {
                from aarJniDir
                include 'libonnxruntime4j_jni.so', 'libonnxruntime.so'
                into new File(jniLibsDir, abi)
              }
            }
          }
          ortMatchedPairCopied = true
          logPrebuilt("onnxruntime", "native", "MAVEN_AAR", aar.name)
          copyOrtHeadersBestEffort(aarExtractDir, "MAVEN_AAR")
          ortVersionFile.text = currentOrtVersion
        }
      } catch (Exception e) {
        println "[onnxruntime] MAVEN_AAR matched-pair copy failed: ${e.message}"
      }
    }
    if (ortNeedsUpdate && !ortMatchedPairCopied && !hasAllOnnxruntimeBundleLibs()) {
      // Legacy: third_party with JNI only (incomplete bundle)
      def tpJniOnly = hasAllLibsUnder(thirdPartyOrtDir, requiredOnnxruntimeJniSoFiles)
      if (tpJniOnly) {
        requiredAbis.each { abi ->
          copy {
            from new File(thirdPartyOrtDir, "jni/${abi}")
            include 'libonnxruntime4j_jni.so'
            into new File(jniLibsDir, abi)
          }
        }
        logPrebuilt("onnxruntime", "jni-only", "THIRD_PARTY")
        println "[onnxruntime] WARN: no libonnxruntime.so in ort third_party — add full bundle or resolve onnxruntime AAR."
        copyOrtHeadersBestEffort(thirdPartyOrtDir, "THIRD_PARTY")
      }
      if (!hasAllOnnxruntimeBundleLibs()) {
        try {
          def aarFiles = project.configurations.onnxruntimeAar.files
          if (!aarFiles.isEmpty()) {
            downloadDir.mkdirs()
            def aar = aarFiles.iterator().next()
            def aarExtractDir = new File(downloadDir, "onnxruntime-aar-extract-jni-only")
            if (aarExtractDir.exists()) aarExtractDir.deleteDir()
            aarExtractDir.mkdirs()
            copy { from zipTree(aar); into aarExtractDir }
            requiredAbis.each { abi ->
              def aarJniDir = new File(aarExtractDir, "jni/${abi}")
              if (aarJniDir.exists()) {
                copy {
                  from aarJniDir
                  include 'libonnxruntime4j_jni.so'
                  into new File(jniLibsDir, abi)
                }
              }
            }
            logPrebuilt("onnxruntime", "jni-only", "MAVEN_AAR", aar.name)
            println "[onnxruntime] WARN: AAR jni/<abi> missing libonnxruntime.so — use a complete onnxruntime AAR."
            copyOrtHeadersBestEffort(aarExtractDir, "MAVEN_AAR")
          } else {
            println "[onnxruntime] MAVEN_AAR: onnxruntimeAar empty — ORT native libs still missing"
          }
        } catch (Exception e) {
          println "[onnxruntime] MAVEN_AAR jni-only failed: ${e.message}"
        }
      }
    }
    if (!hasAllOnnxruntimeBundleLibs()) {
      println "[onnxruntime] WARN: libonnxruntime.so and/or libonnxruntime4j_jni.so missing after resolution. checkJniLibs will fail; use com.xdcobra.sherpa:onnxruntime or full third_party bundle."
    }
    if (hasAllOnnxruntimeBundleLibs() && !hasOnnxruntimeHeaders()) {
      println "[onnxruntime] WARN: ORT native libs present but C API headers missing under src/main/cpp/include/onnxruntime."
      println "[onnxruntime]   CMake (CTC alignment) needs onnxruntime_c_api.h. Bundle headers/onnxruntime or include/onnxruntime in AAR/third_party, or use third_party/onnxruntime/include."
    }

    // =====================================================================
    // Stage 4: GITHUB_RELEASE fallback for sherpa / FFmpeg / libarchive / lexbor / libyuv / libwebp
    // =====================================================================
    def repo = project.findProperty('prebuiltGitHubRepo') ?: getGitHubRepo()
    if (!repo) {
      def needFfmpeg = !sherpaOnnxDisableFfmpeg && !ffmpegResolved
      def needLibarchive = !sherpaOnnxDisableLibarchive && !libarchiveResolved
      def needLexbor = !lexborResolved
      def needLibyuv = !libyuvResolved
      def needLibwebp = sherpaOnnxEnableLibwebp && !libwebpResolved
      def needPdfium = sherpaOnnxEnablePdfium && !pdfiumResolved
      def needSherpa = !sherpaResolved
      if (needFfmpeg || needLibarchive || needLexbor || needLibyuv || needLibwebp || needPdfium || needSherpa) {
        println "[prebuilt] GITHUB_RELEASE: skipped (no repo). Set -PprebuiltGitHubRepo=owner/repo or git remote origin --> github.com"
        println "[prebuilt]   still need: sherpa=${needSherpa}, ffmpeg=${needFfmpeg}, libarchive=${needLibarchive}, lexbor=${needLexbor}, libyuv=${needLibyuv}, libwebp=${needLibwebp}, pdfium=${needPdfium}"
        def diag = [
          "prebuiltGitHubRepo=${project.findProperty('prebuiltGitHubRepo') ?: '(not set)'}",
          "git remote origin=${getGitHubRepo() ?: '(not a GitHub URL or git unavailable)'}",
          "sherpaOnnxDisableFfmpeg=${sherpaOnnxDisableFfmpeg}",
          "sherpaOnnxDisableLibarchive=${sherpaOnnxDisableLibarchive}",
          "sherpaOnnxEnableLibwebp=${sherpaOnnxEnableLibwebp}",
          "sherpaOnnxEnablePdfium=${sherpaOnnxEnablePdfium}",
          "sherpaResolved=${sherpaResolved}",
          "ffmpegResolved=${ffmpegResolved}",
          "libarchiveResolved=${libarchiveResolved}",
          "lexborResolved=${lexborResolved}",
          "libyuvResolved=${libyuvResolved}",
          "libwebpResolved=${libwebpResolved}",
          "pdfiumResolved=${pdfiumResolved}",
        ].join(", ")
        throw new RuntimeException(
          "Native libs/headers still missing and GitHub repo unknown. " +
          "Set -PprebuiltGitHubRepo=owner/repo or ensure git remote origin is a GitHub URL. " +
          "Use Maven (com.xdcobra.sherpa:ffmpeg / sherpa-onnx / libarchive / lexbor / libyuv / libwebp / pdfium), run a Gradle Android build so prebuilts download, or ensure ANDROID_RELEASE_TAG GitHub releases exist. " +
          (sherpaOnnxDisableFfmpeg ? "(FFmpeg disabled via sherpaOnnxDisableFfmpeg=true.) " : "") +
          (sherpaOnnxDisableLibarchive ? "(libarchive disabled via sherpaOnnxDisableLibarchive=true.) " : "") +
          (!sherpaOnnxEnableLibwebp ? "(libwebp disabled via sherpaOnnxEnableLibwebp=false.) " : "") +
          (!sherpaOnnxEnablePdfium ? "(pdfium disabled via sherpaOnnxEnablePdfium=false.) " : "") +
          "Diagnostics: [${diag}]"
        )
      }
      return
    }
    def willUseGithub = !sherpaResolved ||
        (!sherpaOnnxDisableFfmpeg && !ffmpegResolved) ||
        (!sherpaOnnxDisableLibarchive && !libarchiveResolved) ||
        (!lexborResolved) ||
        (!libyuvResolved) ||
        (sherpaOnnxEnableLibwebp && !libwebpResolved) ||
        (sherpaOnnxEnablePdfium && !pdfiumResolved)
    if (willUseGithub) {
      println "[prebuilt] GITHUB_RELEASE repo=${repo}"
    }
    def baseUrl = "https://github.com/${repo}/releases/download"
    downloadDir.mkdirs()

    if (!sherpaOnnxDisableFfmpeg && !ffmpegResolved) {
      def ffmpegTagRel = sherpaOnnxEnableVideoSwDecoders
          ? "third_party/ffmpeg_prebuilt/ANDROID_VSW_RELEASE_TAG"
          : "third_party/ffmpeg_prebuilt/ANDROID_RELEASE_TAG"
      def ffmpegZipName = sherpaOnnxEnableVideoSwDecoders ? "ffmpeg-vsw-android.zip" : "ffmpeg-android.zip"
      def ffmpegWorkflow = sherpaOnnxEnableVideoSwDecoders
          ? "build-ffmpeg-vsw-android-release"
          : "build-ffmpeg-android-release"
      def tagFile = file("${project.projectDir.parent}/${ffmpegTagRel}")
      def tag = readReleaseTag(tagFile)
      if (!tag) throw new RuntimeException("Missing or empty ${ffmpegTagRel}")
      def zipFile = new File(downloadDir, ffmpegZipName)
      def url = "${baseUrl}/${tag}/${ffmpegZipName}"
      project.exec { commandLine 'curl', '-sSL', '-o', zipFile, url; workingDir project.projectDir }
      if (!zipFile.exists() || zipFile.length() == 0) {
        throw new RuntimeException("Download failed or empty: ${url}")
      }
      // curl -sSL writes HTML error pages (e.g. 404) without failing; reject non-ZIP payloads.
      def zipMagic = new byte[2]
      zipFile.withInputStream { it.read(zipMagic) }
      if (zipMagic[0] != (byte) 0x50 || zipMagic[1] != (byte) 0x4B) {
        zipFile.delete()
        throw new RuntimeException(
            "Download is not a ZIP (got ${zipFile.length()} bytes). Release asset missing? ${url} — publish via ${ffmpegWorkflow} workflow or use THIRD_PARTY under third_party/ffmpeg_prebuilt/android.")
      }
      def ffmpegExtractDir = new File(downloadDir, "ffmpeg-extract")
      if (ffmpegExtractDir.exists()) ffmpegExtractDir.deleteDir()
      ffmpegExtractDir.mkdirs()
      copy { from zipTree(zipFile); into ffmpegExtractDir }
      copy {
        from fileTree(ffmpegExtractDir) { include 'arm64-v8a/**', 'armeabi-v7a/**', 'x86/**', 'x86_64/**' }
        into jniLibsDir
      }
      def ffmpegIncludeDir = file("${project.projectDir}/src/main/cpp/include/ffmpeg")
      def ffmpegIncludeInZip = new File(ffmpegExtractDir, "include")
      if (ffmpegIncludeInZip.exists()) {
        copy { from fileTree(ffmpegIncludeInZip); into ffmpegIncludeDir }
      }
      downloadDir.mkdirs()
      ffmpegVersionFile.text = currentFfmpegStamp
      logPrebuilt("FFmpeg", "native", "GITHUB_RELEASE", tag)
    }

    if (!sherpaOnnxDisableLibarchive && !libarchiveResolved) {
      def tagFile = file("${project.projectDir.parent}/third_party/libarchive_prebuilt/ANDROID_RELEASE_TAG")
