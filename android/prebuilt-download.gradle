def requiredFfmpegSoFiles = [
  'libavcodec.so', 'libavformat.so', 'libavutil.so', 'libswresample.so', 'libavfilter.so', 'libshine.so'
]
def requiredSherpaOnnxSoFiles = [
  'libsherpa-onnx-jni.so', 'libsherpa-onnx-c-api.so', 'libsherpa-onnx-cxx-api.so'
]
def requiredLibarchiveSoFiles = ['libarchive.so', 'libzstd.so']
def requiredLexborSoFiles = ['liblexbor.so']
def requiredLibyuvSoFiles = ['libyuv.so']
def requiredLibwebpSoFiles = ['libwebp.so', 'libsharpyuv.so']
def requiredPdfiumSoFiles = ['libpdfium.so']
def requiredOnnxruntimeJniSoFiles = ['libonnxruntime4j_jni.so']
/** Both from the same onnxruntime release (AAR or third_party); required for Java ORT + symbol consistency. */
def requiredOnnxruntimeBundleSoFiles = ['libonnxruntime4j_jni.so', 'libonnxruntime.so']

def jniLibsDir = file("${project.projectDir}/src/main/jniLibs")
def sherpaOnnxClassesDir = file("${project.buildDir}/sherpa-onnx-classes")
def onnxruntimeClassesDir = file("${project.buildDir}/onnxruntime-classes")

def thirdPartyDir = file("${project.projectDir.parent}/third_party")
def thirdPartySherpaDir = new File(thirdPartyDir, "sherpa-onnx-prebuilt/android")
def thirdPartyFfmpegDir = new File(thirdPartyDir, "ffmpeg_prebuilt/android")
def thirdPartyShineDir = new File(thirdPartyDir, "shine_prebuilt/android")
def thirdPartyLibarchiveDir = new File(thirdPartyDir, "libarchive_prebuilt/android")
def thirdPartyLexborDir = new File(thirdPartyDir, "lexbor_prebuilt/android")
def thirdPartyLibyuvDir = new File(thirdPartyDir, "libyuv_prebuilt/android")
def thirdPartyLibwebpDir = new File(thirdPartyDir, "libwebp_prebuilt/android")
def thirdPartyPdfiumDir = new File(thirdPartyDir, "pdfium_prebuilt/android")
def thirdPartyOrtDir = new File(thirdPartyDir, "onnxruntime_prebuilt/android")

