# Collect punctuation model assets from k2-fsa/sherpa-onnx punctuation-models release.
# For bulk refresh prefer: Testdata - Collect all model structures (single commit, no push races).

name: Testdata - Collect punctuation model structures

on:
  workflow_dispatch:
    inputs:
      asset_limit:
        description: 'Max number of assets to process (0 or empty = no limit, process all)'
        required: false
        default: 0
        type: number

concurrency:
  group: collect-model-structures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Collect punctuation release stream
        env:
          ASSET_LIMIT: ${{ inputs.asset_limit }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/collect_all_sherpa_model_streams.sh \
            scripts/ci/collect_one_sherpa_release_stream.sh \
            scripts/ci/git_commit_collect_changes.sh
          bash scripts/ci/collect_all_sherpa_model_streams.sh --config sherpa_punctuation_model_release_streams.json

      - name: Commit and push if changed
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/ci/git_commit_collect_changes.sh \
            --message "chore(testdata): update punctuation model structures, expected CSV, and license status from punctuation-models release" \
            --config sherpa_punctuation_model_release_streams.json
