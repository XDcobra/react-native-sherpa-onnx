    }

    if (sherpaOnnxEnablePdfium && !pdfiumResolved) {
      def tagFile = file("${project.projectDir.parent}/third_party/pdfium_prebuilt/ANDROID_RELEASE_TAG")
      def tag = readReleaseTag(tagFile)
      if (!tag) {
        throw new RuntimeException(
            "sherpaOnnxEnablePdfium=true but missing third_party/pdfium_prebuilt/ANDROID_RELEASE_TAG. " +
            "Publish via build-pdfium-android-release (gh workflow run … --ref <feature-branch>).")
      }
      def zipFile = new File(downloadDir, "pdfium-android.zip")
      def url = "${baseUrl}/${tag}/pdfium-android.zip"
      // -f: HTTP errors (e.g. 404) fail the exec instead of writing an HTML/text body as a "zip".
      project.exec { commandLine 'curl', '-fsSL', '-o', zipFile, url; workingDir project.projectDir }
      if (!zipFile.exists() || zipFile.length() == 0) {
        throw new RuntimeException("PDFium download failed: ${url}")
      }
      def extractDir = new File(downloadDir, "pdfium-extract")
      if (extractDir.exists()) extractDir.deleteDir()
      extractDir.mkdirs()
      copy { from zipTree(zipFile); into extractDir }
      copy {
        from fileTree(extractDir) { include 'arm64-v8a/**', 'armeabi-v7a/**', 'x86/**', 'x86_64/**' }
