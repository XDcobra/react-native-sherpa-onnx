# Package libyuv XCFramework for iOS and publish as GitHub Release.
# Release tag is read from third_party/libyuv_prebuilt/IOS_RELEASE_TAG.
#
# When to run manually (Actions --> Framework - libyuv (iOS) Release --> Run workflow):
# 1. After updating third_party/libyuv_prebuilt/IOS_RELEASE_TAG or libyuv submodule.
# 2. When you want to publish a new libyuv iOS release (XCFramework zip).
#
name: Framework - libyuv (iOS) Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-libyuv-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Read release tag
        id: tag
        run: |
          TAG_FILE=third_party/libyuv_prebuilt/IOS_RELEASE_TAG
          if [ ! -f "$TAG_FILE" ]; then
            echo "::error::Missing $TAG_FILE (add a line with the release tag, e.g. libyuv-ios-v1976-1)"
            exit 1
          fi
          RELEASE_TAG=$(grep -v '^#' "$TAG_FILE" | grep -v '^[[:space:]]*$' | head -1 | tr -d '\r\n')
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::Empty release tag in $TAG_FILE"
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          VERSION=$(echo "$RELEASE_TAG" | sed 's/^libyuv-ios-v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using release tag: $RELEASE_TAG (version: $VERSION)"

      - name: Get submodule versions
        id: submodules
        run: |
          echo "libyuv=$(git -C third_party/libyuv rev-parse HEAD 2>/dev/null || echo 'none')" >> "$GITHUB_OUTPUT"

      - name: Cache libyuv prebuilts (iOS)
        uses: actions/cache@v6
        id: libyuv-ios-cache
        with:
          path: |
            third_party/libyuv_prebuilt/ios
            third_party/libyuv_prebuilt/libyuv.xcframework
          key: libyuv-ios-prebuilt-${{ steps.submodules.outputs.libyuv }}-${{ hashFiles('third_party/libyuv_prebuilt/build_libyuv_ios.sh', 'third_party/libyuv_prebuilt/CMakeLists.txt') }}

      - name: Build libyuv iOS XCFramework
        if: steps.libyuv-ios-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x third_party/libyuv_prebuilt/build_libyuv_ios.sh
          third_party/libyuv_prebuilt/build_libyuv_ios.sh

      - name: Create release zip
        run: |
          cd third_party/libyuv_prebuilt
          zip -r ../../libyuv-ios.zip libyuv.xcframework
          cd ../..
          ls -la libyuv-ios.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: libyuv iOS ${{ steps.tag.outputs.release_tag }}
          make_latest: false
          body: |
            ## Archive Structure
            Prebuilt **libyuv** XCFramework for iOS (device + simulator). Used by VideoBuffer color convert / scale / rotate in `react-native-sherpa-onnx`.
            - **libyuv-ios.zip** – Contains `libyuv.xcframework` (arm64 device; arm64 + x86_64 simulator).

            ## Automatic Installation

            If you're using the `react-native-sherpa-onnx` SDK, the libyuv XCFramework is downloaded by `scripts/setup-ios-framework.sh` during `pod install` (tag from `third_party/libyuv_prebuilt/IOS_RELEASE_TAG`). No manual setup required when that path succeeds.

            ## Manual Installation

            1. Download `libyuv-ios.zip` from the Assets below
            2. Extract and install:
               ```bash
               unzip libyuv-ios.zip
               cp -R libyuv.xcframework /path/to/react-native-sherpa-onnx/ios/Frameworks/
               ```
            3. Run `pod install`

            ## Framework Details

            - **Version:** ${{ steps.tag.outputs.release_tag }}
            - **Architectures:** arm64 (device), arm64 + x86_64 (simulator)
            - **Contents:** libyuv.a, headers under the XCFramework slices

            Always-on for VideoBuffer. No disable flag.
          files: libyuv-ios.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## libyuv iOS release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** [${{ steps.tag.outputs.release_tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`libyuv-ios.zip\` | XCFramework containing libyuv for iOS. |" >> $GITHUB_STEP_SUMMARY
