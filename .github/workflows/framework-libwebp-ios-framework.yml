# Package libwebp XCFramework for iOS and publish as GitHub Release.
# Release tag is read from third_party/libwebp_prebuilt/IOS_RELEASE_TAG.
#
# When to run manually (Actions --> Framework - libwebp (iOS) Release --> Run workflow):
# 1. After updating third_party/libwebp_prebuilt/IOS_RELEASE_TAG or libwebp submodule.
# 2. When you want to publish a new libwebp iOS release (XCFramework zip).
#
name: Framework - libwebp (iOS) Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-libwebp-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Read release tag
        id: tag
        run: |
          TAG_FILE=third_party/libwebp_prebuilt/IOS_RELEASE_TAG
          if [ ! -f "$TAG_FILE" ]; then
            echo "::error::Missing $TAG_FILE (add a line with the release tag, e.g. libwebp-ios-v1.5.0)"
            exit 1
          fi
          RELEASE_TAG=$(grep -v '^#' "$TAG_FILE" | grep -v '^[[:space:]]*$' | head -1 | tr -d '\r\n')
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::Empty release tag in $TAG_FILE"
            exit 1
          fi
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          VERSION=$(echo "$RELEASE_TAG" | sed 's/^libwebp-ios-v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using release tag: $RELEASE_TAG (version: $VERSION)"

      - name: Get submodule versions
        id: submodules
        run: |
          echo "libwebp=$(git -C third_party/libwebp rev-parse HEAD 2>/dev/null || echo 'none')" >> "$GITHUB_OUTPUT"

      - name: Cache libwebp prebuilts (iOS)
        uses: actions/cache@v6
        id: libwebp-ios-cache
        with:
          path: |
            third_party/libwebp_prebuilt/ios
            third_party/libwebp_prebuilt/libwebp.xcframework
          key: libwebp-ios-prebuilt-${{ steps.submodules.outputs.libwebp }}-${{ hashFiles('third_party/libwebp_prebuilt/build_libwebp_ios.sh') }}

      - name: Build libwebp iOS XCFramework
        if: steps.libwebp-ios-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x third_party/libwebp_prebuilt/build_libwebp_ios.sh
          third_party/libwebp_prebuilt/build_libwebp_ios.sh

      - name: Create release zip
        run: |
          cd third_party/libwebp_prebuilt
          zip -r ../../libwebp-ios.zip libwebp.xcframework
          cd ../..
          ls -la libwebp-ios.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: libwebp iOS ${{ steps.tag.outputs.release_tag }}
          make_latest: false
          body: |
            ## Archive Structure
            Prebuilt **libwebp** XCFramework for iOS (device + simulator). Used by Offline ImageBuffer WebP decode in `react-native-sherpa-onnx`.
            - **libwebp-ios.zip** – Contains `libwebp.xcframework` (arm64 device; arm64 + x86_64 simulator; `sharpyuv` merged into the framework).

            ## Automatic Installation

            If you're using the `react-native-sherpa-onnx` SDK, the libwebp XCFramework is downloaded by `scripts/setup-ios-framework.sh` during `pod install` (tag from `third_party/libwebp_prebuilt/IOS_RELEASE_TAG`). No manual setup required when that path succeeds.

            ## Manual Installation

            1. Download `libwebp-ios.zip` from the Assets below
            2. Extract and install:
               ```bash
               unzip libwebp-ios.zip
               cp -R libwebp.xcframework /path/to/react-native-sherpa-onnx/ios/Frameworks/
               ```
            3. Run `pod install`

            ## Framework Details

            - **Version:** ${{ steps.tag.outputs.release_tag }}
            - **Architectures:** arm64 (device), arm64 + x86_64 (simulator)
            - **Contents:** libwebp (+ sharpyuv), headers under the XCFramework slices

            Opt-in (default off): set `SHERPA_ONNX_ENABLE_LIBWEBP=1` so the podspec vendors libwebp. Without it, WebP decode/export returns `ERR_IMAGE_WEBP_DISABLED`.
          files: libwebp-ios.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## libwebp iOS release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** [${{ steps.tag.outputs.release_tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`libwebp-ios.zip\` | XCFramework containing libwebp for iOS. |" >> $GITHUB_STEP_SUMMARY
