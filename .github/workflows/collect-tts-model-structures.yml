# Collect TTS model archive structures from k2-fsa/sherpa-onnx tts-models release.
# Streams are defined in scripts/ci/sherpa_tts_model_release_streams.json.
# For bulk refresh prefer: Testdata - Collect all model structures (single commit, no push races).
#
# To add another TTS-related release: append to "streams" in scripts/ci/sherpa_tts_model_release_streams.json.

name: Testdata - Collect TTS model structures

on:
  workflow_dispatch:
    inputs:
      asset_limit:
        description: 'Max number of assets to process (0 or empty = no limit, process all)'
        required: false
        default: 0
        type: number

jobs:
  collect:
    uses: ./.github/workflows/collect-model-structures-reusable.yml
    secrets: inherit
    with:
      config: sherpa_tts_model_release_streams.json
      asset_limit: ${{ inputs.asset_limit }}
      commit_message: 'chore(testdata): update TTS model structures, expected CSV, and license status from tts-models release'
