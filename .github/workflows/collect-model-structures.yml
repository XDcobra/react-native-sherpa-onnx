# Collect sherpa-onnx model archive structures + license CSVs from k2-fsa/sherpa-onnx releases.
#
# Allowed `stream` input values (must match scripts/ci/sherpa_model_collect_manifest.json):
#   all          — all streams, one commit (default)
#   asr          — ASR + QNN (sherpa_asr_model_release_streams.json)
#   tts          — TTS models
#   punctuation  — Punctuation models
#   enhancement  — Speech enhancement models
#   separation   — Source separation models
#
# Invalid stream IDs fail in the validate step before any downloads.
# Only one collect run per branch at a time (shared concurrency group).

name: Testdata - Collect model structures

on:
  workflow_dispatch:
    inputs:
      stream:
        description: 'Stream to collect (all = every stream in manifest order)'
        required: false
        default: all
        type: choice
        options:
          - all
          - asr
          - tts
          - punctuation
          - enhancement
          - separation
      asset_limit:
        description: 'Max assets per stream (0 = no limit)'
        required: false
        default: 0
        type: number

concurrency:
  group: collect-model-structures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate stream against manifest
        env:
          STREAM: ${{ inputs.stream }}
        run: |
          set -euo pipefail
          stream="$(echo -n "${STREAM:-all}" | xargs | tr '[:upper:]' '[:lower:]')"
          [[ -z "$stream" ]] && stream="all"
          mapfile -t allowed < <(jq -r '.streams[].id' scripts/ci/sherpa_model_collect_manifest.json)
          allowed+=("all")
          for id in "${allowed[@]}"; do
            [[ "$id" == "$stream" ]] && exit 0
          done
          echo "Invalid stream: '$stream'" >&2
          echo "Allowed: all ${allowed[*]//all /}" >&2
          exit 1

      - name: Collect and commit
        env:
          ASSET_LIMIT: ${{ inputs.asset_limit }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          STREAM: ${{ inputs.stream }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/run_model_collect.sh
          bash scripts/ci/run_model_collect.sh --stream "${STREAM:-all}"
