      if (!lexborIncludeInZip.exists()) {
        lexborIncludeInZip = new File(lexborExtractDir, "include")
      }
      if (lexborIncludeInZip.exists()) {
        lexborIncludeDir.mkdirs()
        copy { from lexborIncludeInZip; into lexborIncludeDir }
      }
      downloadDir.mkdirs()
      lexborVersionFile.text = currentLexborVersion
      logPrebuilt("lexbor", "native", "GITHUB_RELEASE", tag)
    }

    if (!libyuvResolved) {
      def tagFile = file("${project.projectDir.parent}/third_party/libyuv_prebuilt/ANDROID_RELEASE_TAG")
      def tag = readReleaseTag(tagFile)
      if (!tag) throw new RuntimeException("Missing or empty third_party/libyuv_prebuilt/ANDROID_RELEASE_TAG")
      def zipFile = new File(downloadDir, "libyuv-android.zip")
      def url = "${baseUrl}/${tag}/libyuv-android.zip"
      project.exec { commandLine 'curl', '-sSL', '-o', zipFile, url; workingDir project.projectDir }
