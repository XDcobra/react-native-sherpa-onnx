# Collect ASR-related model archive structures from k2-fsa/sherpa-onnx GitHub releases.
# Streams are defined in scripts/ci/sherpa_asr_model_release_streams.json (tag, tree-cache, fixtures, license CSV).
# For bulk refresh prefer: Testdata - Collect all model structures (single commit, no push races).
#
# To add another release: append an object to "streams" in scripts/ci/sherpa_asr_model_release_streams.json.

name: Testdata - Collect ASR model structures

on:
  workflow_dispatch:
    inputs:
      asset_limit:
        description: 'Max number of assets to process per stream (0 or empty = no limit)'
        required: false
        default: 0
        type: number

jobs:
  collect:
    uses: ./.github/workflows/collect-model-structures-reusable.yml
    secrets: inherit
    with:
      config: sherpa_asr_model_release_streams.json
      asset_limit: ${{ inputs.asset_limit }}
      commit_message: 'chore(stt_testdata): update ASR/QNN model structures, expected CSVs, and license status from sherpa-onnx releases'
