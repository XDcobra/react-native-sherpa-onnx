        throw new RuntimeException(
            "Download is not a ZIP (got ${zipFile.length()} bytes). Release asset missing? ${url} — publish via build-libyuv-android-release workflow or use THIRD_PARTY under third_party/libyuv_prebuilt/android.")
      }
      def libyuvExtractDir = new File(downloadDir, "libyuv-extract")
      if (libyuvExtractDir.exists()) libyuvExtractDir.deleteDir()
      libyuvExtractDir.mkdirs()
      copy { from zipTree(zipFile); into libyuvExtractDir }
      copy {
        from fileTree(libyuvExtractDir) { include 'arm64-v8a/**', 'armeabi-v7a/**', 'x86/**', 'x86_64/**' }
        into jniLibsDir
      }
      def libyuvIncludeDir = file("${project.projectDir}/src/main/cpp/include/libyuv")
      def libyuvIncludeInZip = new File(libyuvExtractDir, "include/libyuv")
      if (libyuvIncludeInZip.exists()) {
        libyuvIncludeDir.mkdirs()
        copy { from libyuvIncludeInZip; into libyuvIncludeDir }
      }
      def yuvH = new File(libyuvExtractDir, "include/libyuv.h")
      if (yuvH.exists()) {
        copy { from yuvH; into file("${project.projectDir}/src/main/cpp/include") }
      }
      downloadDir.mkdirs()
      libyuvVersionFile.text = currentLibyuvVersion
      logPrebuilt("libyuv", "native", "GITHUB_RELEASE", tag)
    }

    if (sherpaOnnxEnableLibwebp && !libwebpResolved) {
      def tagFile = file("${project.projectDir.parent}/third_party/libwebp_prebuilt/ANDROID_RELEASE_TAG")
      def tag = readReleaseTag(tagFile)
      if (!tag) throw new RuntimeException("Missing or empty third_party/libwebp_prebuilt/ANDROID_RELEASE_TAG")
      def zipFile = new File(downloadDir, "libwebp-android.zip")
      def url = "${baseUrl}/${tag}/libwebp-android.zip"
      project.exec { commandLine 'curl', '-sSL', '-o', zipFile, url; workingDir project.projectDir }
      if (!zipFile.exists() || zipFile.length() == 0) throw new RuntimeException("Download failed or empty: ${url}")
      def zipMagicWebp = new byte[2]
      zipFile.withInputStream { it.read(zipMagicWebp) }
      if (zipMagicWebp[0] != (byte) 0x50 || zipMagicWebp[1] != (byte) 0x4B) {
        zipFile.delete()
        throw new RuntimeException(
            "Download is not a ZIP (got ${zipFile.length()} bytes). Release asset missing? ${url} — publish via build-libwebp-android-release workflow or use THIRD_PARTY under third_party/libwebp_prebuilt/android.")
      }
      def libwebpExtractDir = new File(downloadDir, "libwebp-extract")
