def pdfiumThirdPartySoDirForAbi = { File base, String abi ->
  def jniDir = new File(base, "jni/${abi}")
  if (jniDir.exists()) return jniDir
  def abiLibDir = new File(base, "${abi}/lib")
  if (abiLibDir.exists()) return abiLibDir
  return null
}

