# Package PDFium as a real iOS XCFramework and publish a GitHub Release.
# Tag from third_party/pdfium_prebuilt/IOS_RELEASE_TAG.
#
# The slices come from https://github.com/XDcobra/pdfium-binaries (release sdk-<N>, built by
# its workflow "Build for react-native-sherpa-onnx" with iOS 15.1 as the deployment target;
# bblanchon's binaries need iOS 17.0). Run that workflow first for the PDFium version in the tag.
# The assemble step fails if a binary needs more than IOS_MIN or lacks an FPDF function the SDK calls.
#
# Feature-branch: gh workflow run framework-pdfium-ios-framework.yml --ref <branch>
#
name: Prebuilt - PDFium (iOS) XCFramework

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_MIN: '15.1'

jobs:
  build-pdfium-ios:
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read release tag
        id: tag
        run: |
          TAG_FILE=third_party/pdfium_prebuilt/IOS_RELEASE_TAG
          RELEASE_TAG=$(grep -v '^#' "$TAG_FILE" | grep -v '^[[:space:]]*$' | head -1 | tr -d '\r\n')
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          VERSION=$(echo "$RELEASE_TAG" | sed 's/^pdfium-ios-v//')
          CHROMIUM_VERSION=$(echo "$VERSION" | sed 's/-[0-9][0-9]*$//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "chromium_version=$CHROMIUM_VERSION" >> $GITHUB_OUTPUT
          echo "Using release tag: $RELEASE_TAG (Maven: $VERSION, chromium/$CHROMIUM_VERSION)"

      - name: Assemble pdfium.xcframework
        run: |
          chmod +x third_party/pdfium_prebuilt/create_pdfium_ios_xcframework.sh
          third_party/pdfium_prebuilt/create_pdfium_ios_xcframework.sh "${{ steps.tag.outputs.chromium_version }}"
          find third_party/pdfium_prebuilt/pdfium.xcframework -maxdepth 3 | head -40

      - name: Report minimum OS versions
        run: |
          for fw in third_party/pdfium_prebuilt/pdfium.xcframework/*/pdfium.framework; do
            echo "$fw: binary minos $(xcrun vtool -show-build "$fw/pdfium" | awk '$1=="minos"{print $2}' | sort -uV | tr '\n' ' ') / Info.plist MinimumOSVersion $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$fw/Info.plist")"
          done

      - name: Zip XCFramework
        run: |
          cd third_party/pdfium_prebuilt
          zip -r ../../pdfium-ios.zip pdfium.xcframework
          cd ../..
          ls -la pdfium-ios.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: pdfium iOS ${{ steps.tag.outputs.release_tag }}
          make_latest: false
          body: |
            ## Archive Structure
            Prebuilt **PDFium** XCFramework for iOS (device + simulator). Used by offline PDF text-layer extract in `react-native-sherpa-onnx` (`react-native-sherpa-onnx/pdf`).
            - **pdfium-ios.zip** – Contains `pdfium.xcframework` (arm64 device; arm64 + x86_64 simulator; embeddable `pdfium.framework` + headers).

            Slices: [XDcobra/pdfium-binaries](https://github.com/XDcobra/pdfium-binaries) `sdk-${{ steps.tag.outputs.chromium_version }}` (fork of [bblanchon/pdfium-binaries](https://github.com/bblanchon/pdfium-binaries), PDFium `chromium/${{ steps.tag.outputs.chromium_version }}`, deployment target iOS ${{ env.IOS_MIN }}). Upstream binaries need iOS 17.0.

            ## Automatic Installation

            If you're using the `react-native-sherpa-onnx` SDK with `SHERPA_ONNX_ENABLE_PDFIUM=1`, the XCFramework is downloaded by `scripts/setup-ios-framework.sh` during `pod install` (tag from `third_party/pdfium_prebuilt/IOS_RELEASE_TAG`).

            ## Manual Installation

            1. Download `pdfium-ios.zip` from the Assets below
            2. Extract and install:
               ```bash
               unzip pdfium-ios.zip
               cp -R pdfium.xcframework /path/to/react-native-sherpa-onnx/ios/Frameworks/
               ```
            3. Enable PDFium and run `pod install`:
               ```bash
               export SHERPA_ONNX_ENABLE_PDFIUM=1
               pod install
               ```

            ## Framework Details

            - **Version:** ${{ steps.tag.outputs.release_tag }}
            - **Architectures:** arm64 (device), arm64 + x86_64 (simulator)
            - **Minimum iOS:** ${{ env.IOS_MIN }} (`MinimumOSVersion` in each `Info.plist` is read from the binary)
            - **Contents:** `pdfium.framework` (binary + public PDFium headers) per slice
            - **Tag pin:** `third_party/pdfium_prebuilt/IOS_RELEASE_TAG`

            Opt-in (default off): set `SHERPA_ONNX_ENABLE_PDFIUM=1`. Without it, PDFium is not vendored and `extractPdfTextLayer` rejects with `ERR_PDF_PDFIUM_DISABLED`.
          files: |
            pdfium-ios.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## pdfium iOS release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** [${{ steps.tag.outputs.release_tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`pdfium-ios.zip\` | \`pdfium.xcframework\` (device arm64 + simulator arm64/x86_64) |" >> $GITHUB_STEP_SUMMARY
