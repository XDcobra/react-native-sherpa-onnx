# Collect source separation model assets from k2-fsa/sherpa-onnx source-separation-models release.
# Fixtures (structure.txt, expected CSV, license CSV) are generated here only — do not run collect locally.
# Streams are defined in scripts/ci/sherpa_separation_model_release_streams.json.
# For bulk refresh prefer: Testdata - Collect all model structures (single commit, no push races).

name: Testdata - Collect source separation model structures

on:
  workflow_dispatch:
    inputs:
      asset_limit:
        description: 'Max number of assets to process (0 or empty = no limit, process all)'
        required: false
        default: 0
        type: number

jobs:
  collect:
    uses: ./.github/workflows/collect-model-structures-reusable.yml
    secrets: inherit
    with:
      config: sherpa_separation_model_release_streams.json
      asset_limit: ${{ inputs.asset_limit }}
      commit_message: 'chore(testdata): update source separation model structures, expected CSV, and license status from source-separation-models release'
