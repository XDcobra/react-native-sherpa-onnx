# Collect punctuation model assets from k2-fsa/sherpa-onnx punctuation-models release.
# Streams are defined in scripts/ci/sherpa_punctuation_model_release_streams.json.
# For bulk refresh prefer: Testdata - Collect all model structures (single commit, no push races).

name: Testdata - Collect punctuation model structures

on:
  workflow_dispatch:
    inputs:
      asset_limit:
        description: 'Max number of assets to process (0 or empty = no limit, process all)'
        required: false
        default: 0
        type: number

jobs:
  collect:
    uses: ./.github/workflows/collect-model-structures-reusable.yml
    secrets: inherit
    with:
      config: sherpa_punctuation_model_release_streams.json
      asset_limit: ${{ inputs.asset_limit }}
      commit_message: 'chore(testdata): update punctuation model structures, expected CSV, and license status from punctuation-models release'
