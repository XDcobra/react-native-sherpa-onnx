# Speech enhancement validation unit tests (ValidateEnhancementPaths, DetectEnhancementModelFromFileList edge cases).

name: Test – Speech enhancement validation

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-enhancement-validate
  cancel-in-progress: true

jobs:
  enhancement-validate:
    name: Speech enhancement validation (C++)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libgtest-dev

      - name: Configure and build
        run: |
          mkdir -p test/cpp/build && cd test/cpp/build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Run enhancement validation tests
        working-directory: ${{ github.workspace }}
        run: |
          ./test/cpp/build/model_detect_test \
            --gtest_filter=ModelDetectValidation.ValidateEnhancement*:ModelDetectValidation.EnhancementMissingOnnxRejected
